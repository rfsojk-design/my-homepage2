<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>하루의 문장 | 꾹부장의 이야기</title>
<style>
:root{--ink:#152b33;--muted:#4f666e;--subtle:#e3ecee;--canvas:#f3f8f8;--paper:#fff;--accent:#075d65;--tint:#e4f5f4;--max:1080px;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--canvas);font-synthesis:none}
*{box-sizing:border-box}
html{scroll-padding-top:86px}
body{margin:0;font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit}
button{color:inherit}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{cursor:pointer}
button:disabled{cursor:wait;opacity:.65}
:focus-visible{outline:3px solid #087d88;outline-offset:3px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.wrap{width:min(var(--max),calc(100% - 56px));margin-inline:auto}
.topbar{position:sticky;top:0;z-index:3;padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid var(--subtle)}
.topbar-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:1.15rem;font-weight:850;letter-spacing:-.05em;white-space:nowrap}
.brand-icon,.nav-icon{display:grid;place-items:center;flex:none}
.brand-icon{width:33px;height:33px;border-radius:10px;background:var(--accent);color:white;font-size:20px}
.desktop-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.desktop-nav a,.desktop-nav button{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;border:0;border-radius:12px;background:transparent;text-decoration:none;font-weight:700;color:var(--muted)}
.desktop-nav [aria-current="page"]{color:var(--accent);background:var(--tint)}
.action,.soft,.plain{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;text-decoration:none;border-radius:12px;font-weight:750;font-size:.9rem}
.action{background:var(--accent);color:#fff;border:1px solid transparent}
.soft{background:var(--tint);color:var(--accent);border:1px solid transparent}
.plain{border:1px solid var(--subtle);background:var(--paper);color:var(--accent)}
.nav-icon{width:1.5em;height:1.5em;line-height:1;font-size:1.15em}
.icon{width:1.18em;height:1.18em;display:inline-block;vertical-align:-.19em;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:fixed;top:10px;left:10px;z-index:8;transform:translateY(-150%)}
.skip:focus{transform:none}
.hero{margin-top:26px;min-height:300px;display:grid;align-items:end;position:relative;overflow:hidden;isolation:isolate;border-radius:28px;color:#fff;background:#135e67}
.hero>img,.hero::after{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero>img{object-fit:cover;object-position:58% 52%}
.hero::after{content:"";background:linear-gradient(90deg,#091829e0,#091829a8 40%,#09182926 76%,transparent)}
.hero-copy{padding:34px 44px 40px;text-shadow:0 1px 10px #061322b3}
.hero .kicker{font-size:.95rem;color:#e1f9f6;font-weight:700;margin-bottom:10px}
.hero h1{font-size:clamp(2.1rem,5.1vw,3.8rem);letter-spacing:-.075em;line-height:1.13;font-weight:850}
.hero p:last-child{margin-top:12px;color:#f5ffff;font-size:1rem;font-weight:550}
.search-wrap{margin:16px 0 0}
.search{display:flex;align-items:center;gap:11px;min-height:54px;padding:2px 7px 2px 16px;border:1px solid #cbdfe1;border-radius:16px;background:#fff;color:var(--accent)}
.search:focus-within{border-color:#087d88;box-shadow:0 0 0 2px #bce4e4}
.search input{min-width:0;flex:1;border:0;background:transparent;outline:none;color:var(--ink);font-size:1rem;min-height:44px}
.search input::placeholder{color:#5d747a}
.search input::-webkit-search-cancel-button{display:none}
.search button{flex:none;min-height:42px;padding:0 14px;border:0;border-radius:11px;background:var(--tint);color:var(--accent);font-weight:750}
.section{margin-top:29px}
.section-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.section-top h2{font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.3;letter-spacing:-.045em;font-weight:850}
.category-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.category{min-width:0;min-height:110px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:13px 14px 12px;border:1px solid var(--subtle);border-radius:17px;background:var(--paper)}
.category:hover,.category[aria-pressed="true"]{border-color:#68aaab;background:#f2fcfb}
.category-symbol{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:var(--tone-bg,#e5f4f4);color:var(--tone-fg,#126168);font-size:20px}
.category-label{font-weight:800;line-height:1.28;font-size:.92rem;letter-spacing:-.02em}
.category-count{font-size:.78rem;color:var(--muted);line-height:1;margin-top:auto}
.filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.chip{min-height:40px;padding:6px 13px;border:1px solid #dce9ea;border-radius:100px;background:var(--paper);font-weight:700;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}
.count{font-size:.84rem;color:var(--muted);font-weight:650}
.post-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.post{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;min-width:0;overflow:hidden;border:1px solid var(--subtle);border-radius:18px;background:var(--paper)}
.post:hover{border-color:#9cc5c7}
.post-trigger{position:absolute;inset:0;width:100%;border:0;border-radius:inherit;background:transparent}
.post-trigger:focus-visible{outline-offset:-3px}
.post-open{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:13px;width:100%;min-width:0;height:100%;padding:16px;border:0;background:none;text-align:left}
.post-detail{min-width:0}
.post-tag{color:var(--accent);font-size:.78rem;font-weight:800}
.post h3{margin:2px 0 3px;font-size:1.04rem;line-height:1.38;letter-spacing:-.03em}
.excerpt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;color:var(--muted);font-size:.88rem;line-height:1.5;overflow-wrap:anywhere}
.post-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:.76rem}
.post>span{color:#68818a;padding-right:12px}
.empty,.file-panel,.schedule-row{padding:16px 18px;border:1px solid var(--subtle);border-radius:16px;background:var(--paper);color:var(--muted)}
.empty{grid-column:1/-1}
.schedule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.schedule-row{display:flex;align-items:center;gap:13px;color:var(--ink)}
.schedule-date{padding:6px 9px;min-width:59px;text-align:center;border-radius:12px;background:var(--tint);color:var(--accent);font-weight:800;flex:none}
.schedule-detail{min-width:0;flex:1}
.schedule-detail p{font-size:.82rem;color:var(--muted)}
.schedule-edit{padding-inline:8px}
.file-panel{font-size:.9rem}
.file-panel summary{cursor:pointer;color:var(--ink);font-weight:760;min-height:34px;padding-top:5px}
.file-panel p{margin:7px 0 10px}
.file-actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.file-actions label{cursor:pointer}
.file-actions input{position:absolute;width:1px;height:1px;opacity:0}
.file-actions label:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.note{padding:10px 13px;margin-top:12px;border-radius:12px;background:var(--tint);color:#164f56;font-size:.85rem}
#preview-note{margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#preview-note .plain{min-height:36px;padding:4px 9px;font-size:.81rem}
.notice{margin-top:14px;padding:10px 13px;border:1px solid #a5ccce;border-radius:13px;background:#f0fbfa;color:var(--accent)}
footer{margin:28px 0 25px;padding:15px 0;border-top:1px solid var(--subtle);color:var(--muted);font-size:.86rem}
.mobile-nav{display:none}
dialog{max-width:none;width:min(660px,calc(100% - 36px));max-height:calc(100% - 34px);max-height:calc(100dvh - 34px);padding:0;border:0;border-radius:22px;background:#fff;color:var(--ink);box-shadow:0 18px 75px #0d292f48;overscroll-behavior:contain}
dialog::backdrop{background:#10363e9c}
.dialog-top{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:55px;padding:7px 18px;border-bottom:1px solid var(--subtle);background:#fff;z-index:1}
.dialog-top button{min-width:44px;min-height:44px;border:0;border-radius:10px;background:var(--canvas);font-size:1.5rem;line-height:1}
.dialog-body{padding:21px 25px 27px}
.dialog-body h2{font-size:clamp(1.45rem,4vw,2rem);letter-spacing:-.04em;line-height:1.27}
.reader-text{white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;line-height:1.85;margin-top:17px}
.dialog-actions{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.editform{margin-top:14px;display:grid;gap:12px}
.editform label{font-size:.92rem;font-weight:730;min-width:0}
.editform input,.editform textarea,.editform select{display:block;width:100%;min-width:0;min-height:46px;padding:8px 10px;margin-top:4px;border:1px solid #c8d9db;border-radius:10px;background:#fff;color:var(--ink);font-size:1rem}
.editform textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.form-message{color:#a33232;font-size:.9rem}
body:has(dialog[open]){overflow:hidden}
@media(max-width:700px){
html{scroll-padding-top:75px}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{width:calc(100% - 30px)}
.topbar-inner{min-height:57px}
.desktop-nav{display:none}
.topbar .action{min-height:38px;padding-inline:11px}
.hero{margin-top:15px;border-radius:21px;min-height:215px}
.hero>img{object-position:60% 54%}
.hero::after{background:linear-gradient(90deg,#091829b8,#09182970 53%,transparent),linear-gradient(0deg,#09182980,transparent 73%)}
.hero-copy{padding:19px 18px 23px}
.hero .kicker{font-size:.87rem;margin-bottom:7px}
.hero p:last-child{margin-top:9px;font-size:.91rem}
.section{margin-top:22px}
.search-wrap{margin-top:11px}
.category-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.category{min-height:92px;padding:9px;border-radius:13px;gap:5px}
.category-symbol{width:30px;height:30px;border-radius:9px;font-size:17px}
.category-label{font-size:.84rem}
.category-count{font-size:.73rem}
.filter-bar{flex-wrap:nowrap;overflow-x:auto;padding:3px 3px 5px;margin-inline:-3px;scrollbar-width:thin}
.chip{white-space:nowrap;flex:none;min-height:43px}
.post-grid,.schedule-grid{grid-template-columns:1fr}
.post-open{padding:13px 11px;gap:10px}
.post .category-symbol{width:34px;height:34px}
.mobile-nav{position:fixed;z-index:3;inset:auto 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));min-height:61px;padding:4px 10px calc(4px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--subtle);box-shadow:0 -4px 18px #1c43430a}
.mobile-nav a,.mobile-nav button{min-height:49px;display:grid;justify-items:center;align-content:center;gap:2px;padding:3px 1px;border:0;border-radius:10px;background:transparent;color:var(--muted);text-decoration:none;font-size:.73rem;font-weight:750}
.mobile-nav [aria-current="page"]{color:var(--accent);background:var(--tint)}
.mobile-nav .icon{width:21px;height:21px}
dialog{width:100%;max-height:95dvh;margin:auto 0 0;border-radius:22px 22px 0 0}
.dialog-body{padding:17px 16px calc(23px + env(safe-area-inset-bottom))}
}
@media(max-width:360px){.wrap{width:calc(100% - 24px)}.category{padding:8px 6px}.hero h1{font-size:1.95rem}.post>span{padding-right:8px}}
</style>
</head>

<script id="snapshot" type="application/json">{"posts":[{"id":5,"title":"2026년 8월3일 아침 말씀 묵상","content":"8월 3일 아침 묵상 – 시편 133편~134편\r\n\r\n시편 133편은 형제가 연합하여 함께하는 것이 얼마나 선하고 아름다운지를 말씀한다. 하나님께서는 연합하는 공동체 가운데 기름 부으시고, 생명의 복을 허락하신다.\r\n\r\n이 말씀을 묵상하면서 하나님께서 내게 허락하신 교회 공동체가 떠올랐다. 함께 신앙생활을 하고 있는 남선교회, 성가대, 재정부의 모든 분들은 우연히 만난 사람들이 아니라 하나님께서 내게 붙여 주신 소중한 믿음의 동역자들이다. 그동안 나는 내 삶과 내 문제를 위해 기도하는 시간이 많았지만, 이제는 하나님께서 내게 맡기신 공동체를 위해서도 더욱 기도해야겠다는 마음이 든다.\r\n\r\n오늘은 남선교회 회원들, 성가대원들, 재정부 봉사자 한 사람 한 사람을 위해 기도하겠다. 하나님께서 그들의 가정과 건강, 직장과 신앙을 지켜 주시고, 우리가 한마음으로 하나님을 섬기는 공동체가 되기를 간구하겠다.\r\n\r\n시편 134편은 성전에서 하나님을 섬기는 자들에게 여호와를 송축하라고 권면하며, 천지를 지으신 하나님께서 시온에서 복을 주시기를 축복한다.\r\n\r\n나는 앞으로도 천지를 지으신 전능하신 하나님을 바라보며 찬양하는 삶을 살아가고 싶다. 지금까지 내 삶을 인도하시고 은행을 떠난 이후에도 새로운 길을 열어 주신 하나님께서 앞으로도 가장 좋은 길로 인도하시며 필요한 복을 허락하실 것을 믿는다.\r\n\r\n또한 하나님께서 내게 맡기신 교회의 모든 일에도 더욱 정성을 다해야겠다는 마음이 든다. 은행에 다닐 때에는 맡은 업무를 책임감 있게 수행하기 위해 최선을 다했던 것처럼, 이제는 하나님 나라를 위한 봉사와 섬김에도 같은 마음으로 성실하게 임하고 싶다. 사람에게 인정받기 위해서","status":"published","created_at":"2026-08-02T22:42:39.866Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":6,"title":"2026년 8월4일 QT","content":"말씀: 시편 135편\r\n시편 135편을 묵상하며, 오늘 제 마음에 가장 크게 다가오는 것은 하나님께서 택하신 백성은 하나님을 가까이하며 감사와 찬양으로 살아가야 한다는 말씀입니다.\r\n2절 말씀을 보며, 시편 기자처럼 나도 항상 하나님의 집을 사모하는 사람이 되어야겠다고 다짐합니다. 단지 교회 건물에 자주 가는 것이 아니라, 오늘 하루 어디에 있든지 하나님을 의식하며 살아가는 것이 참된 성전에 거하는 삶이라는 생각이 듭니다. 내 마음이 하나님의 성전이므로, 세상의 걱정과 욕심보다 하나님의 말씀과 성령께서 내 안에 거하시도록 몸과 마음을 거룩하게 지켜야겠습니다. 교회를 사랑하고, 예배를 기뻐하며, 맡겨진 교회 사역도 은행에서 맡은 일을 성실히 감당했던 것처럼 하나님께 드리는 마음으로 최선을 다해야겠습니다.\r\n4절 말씀은 제게 큰 감사의 고백을 하게 합니다. \"여호와께서 자기를 위하여 야곱, 곧 이스라엘을 자기의 특별한 소유로 택하셨음이로다.\" 이 말씀처럼 하나님께서 아무 자격 없는 저를 하나님의 자녀로 불러주시고 특별한 소유 삼아주신 은혜에 감사드립니다. 돌아보면 은행 생활을 큰 사고 없이 마무리하게 하셨고, 좋은 배우자를 만나 가정을 이루게 하셨으며, 두 아들을 하나님 안에서 바르게 성장하게 하셨습니다. 힘들고 답답했던 순간마다 제 기도를 들으셨고, 제가 원하는 방식이 아니라 언제나 가장 선하고 좋은 방법으로 응답해 주셨습니다. 지나온 삶을 돌아볼수록 하나님의 인도하심이 아니었던 순간이 없었음을 고백하게 됩니다.\r\n오늘 말씀은 또한 하나님께서 살아 계신 분이시며, 우상은 아무 능력이 없음을 분명히 보여줍니다. 은행에 다닐 때는 성과와 승진, 인정받는 것","status":"published","created_at":"2026-08-03T21:32:54.375Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":8,"title":"2026년8월5일 QT","content":"**8월 5일 아침 말씀 묵상 – 시편 136편**\r\n\r\n시편 136편은 하나님께 감사해야 할 이유를 하나씩 되새기면서, 매 절마다 “그 인자하심이 영원함이로다”라고 고백하고 있다.\r\n\r\n시편 기자는 모든 천지와 해와 달과 별을 창조하시고, 정하신 질서와 섭리대로 온 우주를 운행하시는 하나님께 감사한다. 또한 이스라엘 백성을 애굽에서 구원하시고, 광야를 지나게 하시며, 적대국과의 전쟁에서 승리하게 하시고, 마침내 약속의 땅을 기업으로 주신 하나님께 감사하고 있다.\r\n\r\n이 말씀을 묵상하면서 온 우주를 창조하시고 다스리시는 하나님의 위대하심을 새삼 깨닫게 된다. 이처럼 크고 위대하신 하나님께서 작은 나의 인생까지도 관심을 가지고 책임져 주시며, 계획하시고 인도해 주신다는 사실이 놀랍고 감사하다. 지금까지 내가 살아온 모든 과정 속에도 하나님의 인자하심이 함께하셨으며, 그 사랑은 앞으로도 변하지 않을 것이다.\r\n\r\n특히 22절의 “이스라엘에게 기업으로 주셨으니”라는 말씀을 보면서, 하나님께서 새로운 직업을 찾고 있는 나에게도 가장 좋은 것을 준비해 주실 것이라고 믿는다.\r\n\r\n나는 50세가 넘은 적지 않은 나이에, 이제는 내가 하고 싶은 일을 하면서 인생을 살아보고 싶다는 마음으로 은행을 퇴직하였다. 그러나 막상 퇴직하고 보니 내가 진정으로 무엇을 좋아하는지, 앞으로 어떤 일을 해야 할지 정확히 알지 못하는 상태이다. 그래서 마음이 조급해져 이런저런 채용공고를 계속 찾아보는 나의 모습을 보게 된다.\r\n\r\n조금 천천히 해도 되는데 왜 이렇게 조급한지 생각해 본다. 하나님의 인도하심을 온전히 신뢰하지 못하기 때문일 수도 있고, 여전히 내 힘과 능력으로 무엇인가를 빨리 이","status":"published","created_at":"2026-08-04T21:31:32.221Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":9,"title":"인생2막- 새로운 직업(직장) 선택 기준","content":"다음의 3가지 조건을 충족 해야한다.\r\n1. 이 일은 성과압박과 경쟁에서 벗어나 평안하게 지속할 수 있는가?\r\n2. 은행에서 쌓은 금융·심사·기획 경험을 의미 있게 사용할 수 있는가?\r\n3. 수입이나 지위보다 보람과 생활의 균형을 얻을 수 있는가?","status":"published","created_at":"2026-08-04T21:58:24.712Z","category":"인생2막 새출발 계획","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":true},{"id":10,"title":"2026년 8월6일 QT","content":"**8월 6일 아침 말씀 묵상 – 시편 138편**\r\n\r\n시편 138편은 다윗이 하나님의 인자하심과 진실하심을 찬양하고, 자신의 기도에 응답하신 하나님께 감사드리는 말씀이다. 또한 높고 위대하신 하나님께서 낮은 자를 살피시고, 환난 가운데 있는 사람을 보호하시며, 그 사람을 향한 뜻을 끝까지 이루어 주신다는 믿음의 고백이 담겨 있다.\r\n\r\n**2절 말씀**\r\n\r\n“내가 주의 성전을 향하여 예배하며 주의 인자하심과 성실하심으로 말미암아 주의 이름에 감사하오리니”\r\n\r\n이 말씀을 묵상하며 교회에서 하나님께 예배드리는 것을 더욱 사모해야겠다고 다짐한다. 예배를 매주 반복되는 일정이나 의무로 여기지 않고, 나를 구원하시고 지금까지 인도하신 하나님을 만나며 감사와 찬양을 드리는 귀한 시간으로 받아들여야겠다.\r\n\r\n나는 은행 생활을 무사히 마치게 하시고, 가정을 이루게 하시며, 자녀들이 올바르게 성장하도록 인도해 주신 하나님의 은혜를 받았다. 새로운 인생을 시작하는 지금도 하나님께서는 나와 함께하시며 나의 길을 인도하고 계신다. 이러한 은혜를 당연하게 여기지 않고 오늘 하루 작은 일에도 감사하며 살아야겠다.\r\n\r\n또한 다윗은 하나님께서 주의 말씀을 주의 모든 이름보다 높게 하셨다고 고백한다. 나 역시 성경을 단순히 좋은 교훈이나 위로의 글로 읽는 데 그치지 않고, 나에게 주시는 살아 있는 하나님의 말씀으로 진정으로 받아들여야겠다.\r\n\r\n내 생각과 경험, 세상의 기준보다 하나님의 말씀을 더욱 신뢰하고, 중요한 선택을 할 때마다 말씀에 비추어 판단해야 한다. 새로운 직업과 인생의 방향을 찾는 과정에서도 조급한 마음이나 현실적인 조건에만 이끌리지 않고, 말씀을 붙들며 하나님","status":"published","created_at":"2026-08-05T21:54:00.181Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":11,"title":"2026년 8월11일(화) QT","content":"**8월 11일 아침 말씀 묵상 – 시편 139편**\r\n\r\n시편 139편을 읽으면서 하나님께서는 나의 겉으로 드러난 행동뿐 아니라 마음속 생각과 고민까지 모두 알고 계시는 분이라는 사실을 다시 생각하게 된다. 또한 나를 태어나기 전부터 아시고 나의 몸과 마음을 지으셨으며, 앞으로 살아갈 날까지도 하나님의 주권 아래 있다는 사실을 고백하게 된다.\r\n\r\n### 1~4절 – 나의 모든 것을 아시는 하나님\r\n\r\n“여호와여 주께서 나를 살펴보셨으므로 나를 아시나이다.”\r\n\r\n하나님께서는 내가 앉고 일어서는 것을 아시며, 멀리서도 나의 생각을 밝히 아신다. 내가 걸어가는 길과 눕는 것까지 살펴보시며, 내가 무슨 말을 하기 전에도 이미 알고 계신다.\r\n\r\n이 말씀을 묵상하면서 하나님께서는 정말 나의 모든 것을 알고 계신다는 생각이 든다.\r\n\r\n사람들에게는 설명하기 어려운 마음도 하나님께서는 아신다. 내가 무엇 때문에 기뻐하는지, 무엇 때문에 걱정하는지, 무엇을 원하는지, 어떤 생각으로 하루를 살아가는지를 하나님께서는 이미 알고 계신다.\r\n\r\n특히 앞으로 어떤 일을 하면서 살아가야 할지 고민하고 있는 지금의 내 마음도 하나님께서는 모두 알고 계신다. 내가 새로운 직업을 찾으면서 느끼는 기대와 조급함, 내가 정말 좋아하는 일이 무엇인지 잘 모르겠다는 혼란까지도 하나님께서는 알고 계신다.\r\n\r\n그렇다면 하나님 앞에서 내 마음을 감출 필요가 없다. 내가 잘 정리된 생각과 좋은 모습으로만 하나님께 나아가야 하는 것이 아니라, 혼란스럽고 답답한 마음까지 솔직하게 말씀드릴 수 있다.\r\n\r\n그리고 하나님께서는 단지 나의 현재 마음만 아시는 것이 아니라 **내가 어떤 길을 걸어가고 있는지도 알고 계신다.*","status":"published","created_at":"2026-08-11T00:08:40.368Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":12,"title":"2026년 8월12일(수) QT","content":"# 8월 12일 아침 말씀 묵상 – 시편 140편\r\n\r\n시편 140편은 다윗이 악한 사람들과 자신을 해치려는 사람들로부터 보호해 달라고 하나님께 간구하는 말씀이다. 다윗은 자신을 둘러싼 어려움을 자신의 힘으로 해결하려 하기보다 하나님께 가지고 나아가며, 하나님께서 자신의 기도를 들으시고 보호하시며 결국 의인을 지켜 주실 것을 믿는다.\r\n\r\n오늘 말씀을 읽으면서 **나의 기도를 들으시는 하나님, 어려움 가운데 나를 보호하시는 하나님, 그리고 내가 어떤 사람으로 살아가야 하는가**를 생각하게 된다.\r\n\r\n## 6절 – 나의 간구에 귀를 기울이시는 하나님\r\n\r\n“내가 여호와께 말하기를 주는 나의 하나님이시니 여호와여 나의 간구하는 소리에 귀를 기울이소서 하였나이다.”\r\n\r\n다윗은 위기의 순간에 하나님을 **“나의 하나님”**이라고 고백한다.\r\n\r\n나에게도 하나님은 멀리 계신 분이 아니라 내가 기도할 때 들으시고 응답하시는 ‘나의 하나님’이시다. 지금까지 살아오면서 드렸던 수많은 기도를 하나님께서 들으셨고, 내가 기대했던 방법과 다를 때도 있었지만 결국 가장 좋은 방향으로 인도해 주셨음을 돌아보게 된다.\r\n\r\n지금 나에게 가장 큰 기도제목 가운데 하나는 인생 후반부에 어떤 일을 하면서 살아갈 것인가 하는 문제이다.\r\n\r\n이제는 급여가 얼마나 높은가, 직책이 무엇인가, 사회적으로 얼마나 인정받는가를 가장 중요한 기준으로 삼고 싶지 않다.\r\n\r\n**나의 성품에 맞는 일, 지나친 실적 압박이 없는 일, 다른 사람을 몰아붙이지 않아도 되는 일, 마음의 평안을 지키면서 오래 할 수 있는 일을 하고 싶다.**\r\n\r\n하나님께서 이러한 나의 마음과 기도를 이미 알고 계시며, 오늘 6절 말씀처럼 나의 ","status":"published","created_at":"2026-08-11T22:04:40.270Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":13,"title":"2026년8월15일(토) QT","content":"# 8월 15일 아침 말씀 묵상 – 시편 141편\r\n\r\n오늘 시편 141편을 묵상하면서 특별히 **기도와 말의 절제**에 대해 생각하게 된다. 다윗은 어려운 상황 속에서 자신의 문제를 스스로 해결하려 하기보다 먼저 하나님께 부르짖고, 동시에 자신의 입술과 마음이 죄로 향하지 않도록 지켜 달라고 기도한다.\r\n\r\n## 1절 – 나의 기도를 들으시는 하나님\r\n\r\n“여호와여 내가 주를 불렀사오니 속히 내게 오시옵소서 내가 주께 부르짖을 때에 내 음성에 귀를 기울이소서.”\r\n\r\n이 말씀을 읽으면서 내가 하나님께 기도할 수 있다는 것 자체가 감사한 일이라는 생각이 든다.\r\n\r\n하나님께서는 크고 위대하신 분이지만 작은 나의 기도에도 귀를 기울여 주신다. 내가 기뻐할 때 드리는 감사의 기도뿐 아니라 걱정되고 답답할 때 드리는 간구도 들어 주신다.\r\n\r\n때로는 내가 원하는 방법이나 시기에 응답이 나타나지 않을 수 있지만, 하나님께서는 나의 기도를 듣고 계신다. 최근 말씀을 묵상하면서 계속해서 하나님께서 나의 길을 알고 계시고, 나의 간구를 들으시며, 나를 보호하고 인도하신다는 말씀을 만나게 된다.\r\n\r\n앞으로의 직업과 인생 후반부를 놓고도 계속 기도하고 있다. 어떤 일이 나에게 가장 적합한지, 어떤 길이 하나님께서 원하시는 길인지 아직 정확히 알지 못하지만 그것까지 하나님께 솔직하게 말씀드리면 된다.\r\n\r\n내가 모든 답을 가지고 하나님께 나아가는 것이 아니라, **답을 알지 못하기 때문에 하나님께 기도하는 것**이라는 생각이 든다.\r\n\r\n그러므로 오늘도 조급하게 답을 만들어 내려고 하기보다 하나님께 기도하며 하루를 시작하겠다. 하나님께서 나의 기도를 듣고 계심을 믿고 평안한 마음으로 기다리","status":"published","created_at":"2026-08-14T22:23:48.380Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":14,"title":"2026년8월17일(월) QT","content":"# 8월 17일 아침 말씀 묵상 – 시편 142편\r\n\r\n**3절**  \r\n“내 영이 내 속에서 상할 때에도 주께서 내 길을 아셨나이다.”\r\n\r\n**5절**  \r\n“여호와여 내가 주께 부르짖어 말하기를 주는 나의 피난처시요 살아 있는 사람들의 땅에서 나의 분깃이시라 하였나이다.”\r\n\r\n오늘은 이 두 말씀을 중심으로 묵상한다.\r\n\r\n## 3절 – 하나님께서는 언제나 나의 길을 알고 계신다\r\n\r\n다윗은 매우 어려운 상황에 처해 있었다. 자신은 앞으로 어떻게 해야 할지 알 수 없었지만 한 가지는 분명히 믿었다.\r\n\r\n**“주께서 내 길을 아셨나이다.”**\r\n\r\n나도 이 말씀을 믿고 살아가야겠다.\r\n\r\n나는 앞으로 내 인생이 어떻게 펼쳐질지 알지 못한다. 앞으로 어떤 일을 하게 될지, 어떤 사람들을 만나게 될지, 어떤 길이 나에게 가장 좋은 길인지도 지금은 정확히 알 수 없다.\r\n\r\n하지만 내가 길을 알지 못한다고 해서 길이 없는 것은 아니다.\r\n\r\n**하나님께서는 이미 나의 길을 알고 계신다.**\r\n\r\n지난 삶을 돌아보아도 내가 모든 것을 계획해서 여기까지 온 것은 아니다. 내가 예상하지 못했던 일도 있었고, 내가 원했던 방향과 다르게 흘러간 일도 있었지만 그 과정 속에서도 하나님께서 나를 지켜 주시고 인도해 주셨다.\r\n\r\n그러므로 앞으로의 삶도 하나님께 맡기겠다.\r\n\r\n특히 새로운 직업을 생각할 때 조급해하지 않겠다. 내가 원하는 직업을 빨리 찾아야 한다는 생각보다 하나님께서 나에게 어떤 길을 준비하고 계신지를 기도하며 기다리겠다.\r\n\r\n물론 아무것도 하지 않고 기다리기만 하겠다는 것은 아니다. 내가 해야 할 준비를 하고, 필요한 정보를 찾아보고, 공부하고, 기회가 있을 때 지원하겠다.\r\n\r\n그러나 **결과까지 내가 ","status":"published","created_at":"2026-08-16T21:28:38.232Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":15,"title":"2026년8월18일(화) QT","content":"# 8월 18일 아침 말씀 묵상 – 시편 143편\r\n\r\n오늘 시편 143편 말씀을 통해 **지금까지 내 삶에 행하신 하나님의 은혜를 기억하고 감사하며, 매일 아침 말씀을 통해 내가 가야 할 길을 하나님께 묻는 삶**을 살아야겠다고 다짐한다.\r\n\r\n## 5~6절 – 하나님께서 행하신 모든 일을 생각하며 찬양하자\r\n\r\n다윗은 어려움 가운데서 지나간 날들을 기억하고 하나님께서 행하신 모든 일을 묵상하며, 하나님을 향하여 두 손을 편다.\r\n\r\n나 역시 오늘 하루 **하나님께서 지금까지 나에게 행하신 모든 일들을 생각하며 감사하고 찬양하는 하루**를 보내야겠다.\r\n\r\n살아온 시간을 돌아보면 모든 것이 내 힘과 노력만으로 이루어진 것이 아니었다.\r\n\r\n직장생활을 큰 어려움 없이 마칠 수 있도록 지켜 주셨고, 가정을 이루게 하셨으며, 자녀들이 성장하는 과정을 지켜 주셨다. 어려운 순간마다 나를 붙드시고, 내가 알지 못하는 순간에도 길을 열어 주시며 여기까지 인도해 주셨다.\r\n\r\n당시에는 이해되지 않았던 일들도 시간이 지나 돌아보면 하나님의 보호하심과 인도하심이 있었음을 깨닫게 되는 경우가 많았다.\r\n\r\n그래서 앞으로의 삶이 아직 분명하게 보이지 않는다고 해서 불안해할 필요가 없다는 생각이 든다.\r\n\r\n**지금까지 나를 인도하신 하나님께서 앞으로도 나를 인도하실 것이기 때문이다.**\r\n\r\n미래에 대한 걱정이 생길 때마다 아직 일어나지 않은 일을 생각하며 불안해하기보다, 지금까지 하나님께서 내게 행하신 일들을 먼저 기억해야겠다.\r\n\r\n그리고 하나님께 감사할 것을 의식적으로 찾아보겠다.\r\n\r\n오늘 하루를 허락하신 것, 건강을 주신 것, 가족을 주신 것, 교회와 믿음의 공동체를 허락하신 것, 오랜 직장생","status":"published","created_at":"2026-08-17T22:45:49.252Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":16,"title":"2026년8월19일(수) QT","content":"# 8월 19일 아침 말씀 묵상 – 시편 144편\r\n\r\n오늘 시편 144편을 묵상하며 **짧은 나의 인생을 기억하시고 돌보시는 하나님께 감사하고, 나와 우리 자녀들의 앞날과 가정의 필요를 하나님께 맡기는 믿음**을 생각한다.\r\n\r\n## 3~4절 – 나를 알아주시고 생각하여 주시는 하나님\r\n\r\n“여호와여 사람이 무엇이기에 주께서 그를 알아주시며 인생이 무엇이기에 그를 생각하시나이까 사람은 헛것 같고 그의 날은 지나가는 그림자 같으니이다.”\r\n\r\n오늘 이 말씀이 마음에 깊이 들어온다.\r\n\r\n온 우주를 창조하시고 다스리시는 크고 위대하신 하나님께서 작은 나 한 사람을 알아주시고, 나의 인생을 생각하여 주신다는 사실이 참으로 감사하다.\r\n\r\n수많은 사람 가운데 하나님께서 나를 창조하시고, 하나님의 자녀로 불러 주시고, 지금까지 은혜 가운데 살아가도록 인도하여 주셨음을 감사드린다.\r\n\r\n내가 하나님을 먼저 찾아간 것이 아니라 하나님께서 먼저 나를 아셨고, 내가 알지 못했던 순간에도 나를 지켜주시고 여기까지 인도하여 주셨다.\r\n\r\n돌아보면 내 삶 가운데 당연한 것은 하나도 없었다.\r\n\r\n가정을 이루게 하시고, 두 아들을 허락하시고, 오랜 직장생활을 무사히 마칠 수 있게 하시고, 믿음 안에서 교회를 섬기며 살아갈 수 있도록 해주신 것 모두 하나님의 은혜이다.\r\n\r\n그런데 4절은 동시에 사람의 인생이 얼마나 짧은지도 깨닫게 한다.\r\n\r\n“사람은 헛것 같고 그의 날은 지나가는 그림자 같다.”\r\n\r\n지금까지 살아온 시간을 돌아보면 정말 빠르게 지나갔다는 생각이 든다. 앞으로 나에게 얼마나 많은 날이 남아 있는지는 알 수 없다.\r\n\r\n그러므로 남아 있는 삶을 아무 의미 없이 흘려보내고 싶지 않다.\r","status":"published","created_at":"2026-08-19T01:00:02.561Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":17,"title":"2026년8월21일(금) QT","content":"# 8월 21일 아침 말씀 묵상 – 시편 145편\r\n\r\n오늘 시편 145편을 묵상하면서 **우리 가정이 대대로 하나님을 찬양하고 예배하는 믿음의 가정이 되기를 소망하며, 나와 우리 가족을 붙드시고 때를 따라 필요한 것을 채워 주시는 하나님을 더욱 신뢰해야겠다**는 마음을 갖는다.\r\n\r\n## 4절 – 대대로 하나님을 찬양하는 가정이 되게 하소서\r\n\r\n“대대로 주께서 행하시는 일을 크게 찬양하며 주의 능한 일을 선포하리로다.”\r\n\r\n이 말씀을 읽으면서 나의 믿음이 나 한 사람에게서 끝나는 것이 아니라 두 아들과 그 후손들에게까지 이어지기를 기도한다.\r\n\r\n하나님께서 지금까지 나와 우리 가정에 베풀어 주신 은혜가 참으로 많다. 가정을 이루게 하시고 두 아들을 주셨으며, 지금까지 가족 모두를 지켜 주시고 각자의 길을 인도하여 주셨다.\r\n\r\n이러한 하나님의 은혜를 나만 기억하는 것이 아니라 자녀들에게도 전해야겠다.\r\n\r\n우리 아이들이 하나님께서 부모의 삶 가운데 어떻게 역사하셨는지 기억하고, 자신들의 삶에서도 하나님의 인도하심을 경험하며, 또 그것을 다음 세대에게 전하는 가정이 되었으면 좋겠다.\r\n\r\n세상적으로 성공하고 풍족하게 살아가는 것도 감사한 일이지만 그보다 더 큰 복은 **우리 자녀들이 평생 하나님을 떠나지 않고 예배하며 살아가는 것**이라고 생각한다.\r\n\r\n두 아들이 힘든 일을 만났을 때 하나님을 찾고, 좋은 일이 있을 때 하나님께 감사하며, 중요한 선택을 할 때 자신의 생각과 능력만을 의지하지 않고 하나님의 뜻을 먼저 구하는 사람들이 되기를 원한다.\r\n\r\n그리고 훗날 우리 자녀들의 가정과 그 후손들까지 하나님을 찬양하고 예배하기를 소망한다.\r\n\r\n**“대대로 주께서 행","status":"published","created_at":"2026-08-20T23:52:25.911Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":18,"title":"2026년8월24일(월) QT","content":"# 8월 24일 아침 말씀 묵상 – 시편 146편\r\n\r\n오늘 시편 146편 말씀을 묵상하면서 **하나님을 평생 찬양하고, 사람이나 세상의 것을 의지하기보다 하나님께만 소망을 두며, 아직 앞길이 보이지 않을 때에도 하나님의 도우심을 잠잠히 기다리는 믿음**을 가져야겠다고 다짐한다.\r\n\r\n## 2절 – 나의 하나님이시기에 평생 찬양하겠습니다\r\n\r\n“나의 생전에 여호와를 찬양하며 나의 평생에 내 하나님을 찬송하리로다.”\r\n\r\n오늘 이 말씀을 읽으면서 하나님을 찬양하는 이유에 대해 생각하게 된다.\r\n\r\n하나님께서 내가 원하는 것을 이루어 주셨기 때문에만 찬양하는 것이 아니다. 좋은 일이 있을 때만 찬양하고, 어려움이 있을 때에는 찬양하지 못하는 신앙이 되어서는 안 되겠다.\r\n\r\n**하나님께서 ‘나의 하나님’이시라는 그 사실 하나만으로도 나는 하나님을 찬양할 이유가 충분하다.**\r\n\r\n나를 창조하시고, 하나님의 자녀로 불러 주시고, 지금까지 나의 삶과 우리 가족을 지켜 주신 하나님이시기 때문이다.\r\n\r\n내 인생을 돌아보면 수많은 하나님의 은혜가 있었다. 내가 알지 못하는 순간에도 나를 보호하시고 필요한 것을 공급하시며 여기까지 인도하여 주셨다.\r\n\r\n앞으로의 삶에서도 하나님은 변하지 않으신다.\r\n\r\n그러므로 오늘 하루도 하나님을 찬양하겠다.\r\n\r\n그리고 오늘 하루뿐 아니라 내가 살아 있는 동안 평생 하나님을 찬양하며 살아가기를 원한다.\r\n\r\n나이가 들고 환경이 달라지고 앞으로 어떤 일을 하게 되더라도, 하나님을 사랑하고 예배하며 찬양하는 것이 내 삶의 가장 중요한 부분이 되었으면 좋겠다.\r\n\r\n**“하나님, 오늘도 하나님께서 나의 하나님이심을 감사합니다. 이 한 가지 이유만으로","status":"published","created_at":"2026-08-23T22:01:57.442Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":19,"title":"2026년8월25일(화) QT","content":"# 8월 25일 아침 말씀 묵상 – 시편 147편\r\n\r\n오늘 시편 147편 말씀을 통해 **이미 우리 가정을 지키시고 복 주신 하나님께 감사하며, 앞으로도 우리 가족의 필요를 채우시고 자녀들의 앞길을 선하게 인도하실 하나님을 믿는 믿음**을 묵상한다.\r\n\r\n## 1절 – 하나님을 찬양하는 것이 아름답고 마땅하다\r\n\r\n“할렐루야 우리 하나님을 찬양하는 일이 선함이여 찬송하는 일이 아름답고 마땅하도다.”\r\n\r\n하나님을 찬양하는 것은 좋은 일이 생겼을 때만 하는 일이 아니라, 하나님께서 나의 하나님이시기 때문에 마땅히 드려야 할 고백이라는 생각이 든다.\r\n\r\n오늘 아침 건강하게 일어나 말씀을 묵상할 수 있는 것, 가족과 함께 살아갈 수 있는 것, 지금까지 나의 삶과 가정을 지켜 주신 것 모두가 감사의 이유이다.\r\n\r\n앞으로의 길이 아직 완전히 보이지 않는다고 하더라도 하나님께서 지금까지 나와 함께하셨고 앞으로도 함께하실 것을 믿는다.\r\n\r\n그러므로 오늘 하루도 걱정보다 감사와 찬양을 더 많이 하며 살아가겠다.\r\n\r\n## 13절 – 이미 우리 가정을 지키시고 자녀들에게 복 주신 하나님\r\n\r\n“그가 네 문빗장을 견고히 하시고 네 가운데에 있는 너의 자녀들에게 복을 주셨으며”\r\n\r\n오늘 가장 마음에 남는 말씀이다.\r\n\r\n이 말씀을 읽으면서 나는 하나님께 앞으로 무엇을 더 달라고 구하기 전에, **이미 하나님께서 우리 가정에 얼마나 많은 것을 주셨는지를 먼저 생각해야겠다**는 마음이 든다.\r\n\r\n하나님께서는 이미 나의 문빗장을 견고히 하셨다.\r\n\r\n지금까지 나와 우리 가족을 지켜 주셨고, 가정을 이루게 하셨으며, 긴 직장생활을 무사히 마치게 하시고, 어려운 순간마다 넘어지지 않도록 보호하여 주셨다","status":"published","created_at":"2026-08-25T00:34:26.963Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":20,"title":"2026년8월26일(수) QT","content":"# 8월 26일 아침 말씀 묵상 – 시편 148편\r\n\r\n오늘 시편 148편은 하늘과 땅, 해와 달과 별, 모든 자연과 생명, 그리고 모든 사람에게 하나님을 찬양하라고 선포하는 말씀이다.\r\n\r\n모든 피조물이 하나님을 찬양해야 하는 가장 근본적인 이유는 **하나님께서 그 모든 것을 창조하셨기 때문**이다.\r\n\r\n## 5절 – 하나님께서 나를 지으셨으므로 나는 하나님을 찬양합니다\r\n\r\n“그것들이 여호와의 이름을 찬양함은 그가 명령하시므로 지음을 받았음이로다.”\r\n\r\n오늘 이 말씀이 마음에 깊이 남는다.\r\n\r\n해와 달과 별이 하나님께서 지으신 창조물이듯이 나 역시 하나님께서 지으신 존재이다.\r\n\r\n내가 하나님께 어떤 큰 복을 받았기 때문에만 하나님을 찬양하는 것이 아니다.\r\n\r\n내가 원하는 일이 이루어졌기 때문도 아니고, 모든 문제가 해결되었기 때문도 아니다.\r\n\r\n**하나님께서 나를 지으셨다는 사실 자체가 내가 하나님을 찬양해야 할 충분한 이유이다.**\r\n\r\n하나님께서 나에게 생명을 주시고, 나라는 존재를 세상에 보내셨으며, 지금까지 살아갈 수 있도록 붙들어 주셨다.\r\n\r\n내 몸과 성품, 내가 가진 능력과 경험도 하나님께서 허락하신 것이다.\r\n\r\n그러므로 다른 사람과 비교하면서 내가 가진 것이 부족하다고 생각하기보다, 하나님께서 나를 이렇게 지으셨음을 감사해야겠다.\r\n\r\n그리고 하나님께서 나를 지으셨다면 나의 삶에도 하나님의 뜻과 목적이 있음을 믿고 싶다.\r\n\r\n지금 앞으로의 길이 완전히 보이지 않더라도 내 인생이 의미 없이 흘러가는 것은 아니다.\r\n\r\n나를 창조하신 하나님께서 앞으로의 삶도 알고 계시고 인도하실 것을 믿는다.\r\n\r\n오늘은 특별한 일이 생겨야 하나님을 찬양하는 것","status":"published","created_at":"2026-08-26T22:00:05.816Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":21,"title":"2026년8월27일(목) QT","content":"# 8월 27일 아침 말씀 묵상 – 시편 149편\r\n\r\n오늘 시편 149편을 묵상하면서 **나를 지으신 하나님이 나의 왕이심을 다시 고백하고, 아무 조건 없이 자기 백성을 기뻐하시는 하나님의 사랑을 감사하게 된다.**\r\n\r\n## 2절 – 나를 지으신 하나님, 나의 왕이신 하나님\r\n\r\n“이스라엘은 자기를 지으신 이로 말미암아 즐거워하며 시온의 주민은 그들의 왕으로 말미암아 즐거워할지어다.”\r\n\r\n어제 시편 148편에서 “하나님께서 나를 지으셨으므로 나는 하나님을 찬양합니다”라고 묵상했는데, 오늘 말씀에서도 다시 하나님께서 **나를 지으신 분**이라고 말씀하신다.\r\n\r\n나의 생명과 몸과 마음, 성품과 재능, 지금까지 살아온 모든 시간이 하나님의 손 안에 있음을 다시 생각하게 된다.\r\n\r\n나를 지으신 분이 하나님이시라면, 앞으로 나의 삶을 가장 잘 아시는 분도 하나님이시다.\r\n\r\n그리고 오늘 말씀은 하나님을 나의 **왕**이라고 고백하게 한다.\r\n\r\n왕은 다스리고 인도하는 존재이다. 하나님이 나의 왕이시라는 것은 내 삶의 주인이 내가 아니라 하나님이심을 인정하는 것이다.\r\n\r\n나는 앞으로의 삶에 대해 여러 계획을 세우고 새로운 길을 찾지만, 최종적으로 나의 길을 결정하시고 인도하시는 분은 하나님이심을 믿는다.\r\n\r\n그래서 오늘도 이렇게 기도하고 싶다.\r\n\r\n**“하나님, 하나님께서 나의 왕이십니다. 제가 제 삶을 모두 통제하려 하지 않고, 삶의 모든 자리에서 하나님의 인도하심을 구하며 살아가게 하옵소서.”**\r\n\r\n아직 앞으로의 길이 완전히 보이지 않더라도 조급해하지 않겠다.\r\n\r\n나를 지으신 하나님께서 내가 어떤 사람인지 가장 잘 알고 계시며, 나에게 맞는 길도 알고 계심을 믿기 때문이다.\r","status":"published","created_at":"2026-08-26T22:01:11.189Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":22,"title":"2026년8월28일(금) QT","content":"# 8월 28일 아침 말씀 묵상 – 시편 150편\r\n\r\n최근 계속해서 하나님을 찬양하라는 말씀을 묵상하고 있다.\r\n\r\n그런데 하루를 돌아보면 말씀처럼 살아가지 못했던 것 같아 마음이 걸린다.\r\n\r\n혼자 있는 시간이 많다 보니 넷플릭스를 보거나 금융 관련 유튜브 영상을 보면서 시간을 보내는 경우가 많았다. 물론 그런 것들을 보는 것 자체가 잘못은 아니지만, 내 시간과 마음이 자연스럽게 세상의 정보와 재미에 더 많이 향하고 하나님을 찬양하는 시간은 적었던 것 같다.\r\n\r\n시편 150편의 마지막 말씀은 계속해서 하나님을 찬양하라고 한다.\r\n\r\n이 말씀을 묵상하면서 나는 하나님께 죄송한 마음이 든다.\r\n\r\n하나님께서는 나를 창조하시고, 지금까지 지켜 주시고, 가정을 허락하시고, 자녀들을 주시며, 오랜 직장생활을 잘 마치도록 인도해 주셨다.\r\n\r\n그렇게 많은 은혜를 받았는데도 정작 하루를 살아가면서 하나님을 생각하고 찬양하는 시간보다 다른 것에 마음을 빼앗기는 시간이 더 많았던 것 같다.\r\n\r\n그러나 오늘은 죄책감에만 머물지 않고 작은 것부터 실천하고 싶다.\r\n\r\n하루 종일 모든 일을 멈추고 찬양만 해야 한다는 뜻은 아닐 것이다.\r\n\r\n넷플릭스를 볼 수도 있고, 금융 정보를 찾아볼 수도 있고, 운동이나 다른 일을 할 수도 있다.\r\n\r\n중요한 것은 하루의 모든 시간 가운데 하나님을 잊지 않는 것이라고 생각한다.\r\n\r\n오늘은 틈틈이 찬양을 듣겠다.\r\n\r\n집에 혼자 있을 때 찬양을 틀어 놓고, 익숙한 찬양이 나오면 작은 목소리라도 따라 부르겠다.\r\n\r\n운동하거나 이동할 때에도 찬양을 들으며 마음으로 하나님을 생각하겠다.\r\n\r\n그리고 좋은 일이 있을 때뿐 아니라 아무 특별한 일이 없는 순간에도","status":"published","created_at":"2026-08-27T21:54:45.568Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":23,"title":"2026년8월28일(금) QT","content":"# 8월 28일 아침 말씀 묵상 – 시편 150편\r\n\r\n최근 계속해서 하나님을 찬양하라는 말씀을 묵상하고 있다.\r\n\r\n그런데 하루를 돌아보면 말씀처럼 살아가지 못했던 것 같아 마음이 걸린다.\r\n\r\n혼자 있는 시간이 많다 보니 넷플릭스를 보거나 금융 관련 유튜브 영상을 보면서 시간을 보내는 경우가 많았다. 물론 그런 것들을 보는 것 자체가 잘못은 아니지만, 내 시간과 마음이 자연스럽게 세상의 정보와 재미에 더 많이 향하고 하나님을 찬양하는 시간은 적었던 것 같다.\r\n\r\n시편 150편의 마지막 말씀은 계속해서 하나님을 찬양하라고 한다.\r\n\r\n이 말씀을 묵상하면서 나는 하나님께 죄송한 마음이 든다.\r\n\r\n하나님께서는 나를 창조하시고, 지금까지 지켜 주시고, 가정을 허락하시고, 자녀들을 주시며, 오랜 직장생활을 잘 마치도록 인도해 주셨다.\r\n\r\n그렇게 많은 은혜를 받았는데도 정작 하루를 살아가면서 하나님을 생각하고 찬양하는 시간보다 다른 것에 마음을 빼앗기는 시간이 더 많았던 것 같다.\r\n\r\n그러나 오늘은 죄책감에만 머물지 않고 작은 것부터 실천하고 싶다.\r\n\r\n하루 종일 모든 일을 멈추고 찬양만 해야 한다는 뜻은 아닐 것이다.\r\n\r\n넷플릭스를 볼 수도 있고, 금융 정보를 찾아볼 수도 있고, 운동이나 다른 일을 할 수도 있다.\r\n\r\n중요한 것은 하루의 모든 시간 가운데 하나님을 잊지 않는 것이라고 생각한다.\r\n\r\n오늘은 틈틈이 찬양을 듣겠다.\r\n\r\n집에 혼자 있을 때 찬양을 틀어 놓고, 익숙한 찬양이 나오면 작은 목소리라도 따라 부르겠다.\r\n\r\n운동하거나 이동할 때에도 찬양을 들으며 마음으로 하나님을 생각하겠다.\r\n\r\n그리고 좋은 일이 있을 때뿐 아니라 아무 특별한 일이 없는 순간에도","status":"published","created_at":"2026-08-27T21:54:55.567Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":24,"title":"2026년8월31일(월) QT","content":"# 8월 30일 아침 말씀 묵상 – 신명기 11장\r\n\r\n신명기 11장은 이스라엘 백성이 약속의 땅에 들어가기 전에 모세가 다시 한번 하나님의 말씀에 순종할 것을 권면하는 말씀이다.\r\n\r\n하나님께서 지금까지 이스라엘 백성을 어떻게 인도하셨는지를 기억하고, 하나님을 사랑하며 말씀에 순종하고, 그 말씀을 자녀들에게도 가르치라고 하신다.\r\n\r\n그리고 하나님께 순종하는 길에는 복이 있고, 하나님을 떠나는 길에는 어려움이 있음을 분명히 말씀하신다.\r\n\r\n오늘 말씀을 통해 나는 **지금까지 나를 인도하신 하나님을 기억하고, 말씀을 마음에 두며, 앞으로의 삶에서도 하나님의 말씀에 순종해야겠다**고 생각한다.\r\n\r\n## 1절 – 하나님을 사랑하며 말씀에 순종하자\r\n\r\n“그런즉 네 하나님 여호와를 사랑하여 그가 주신 책무와 법도와 규례와 명령을 항상 지키라.”\r\n\r\n하나님께서는 단순히 말씀을 지키라고만 하지 않으시고 먼저 **하나님을 사랑하라**고 말씀하신다.\r\n\r\n순종의 시작은 의무가 아니라 하나님을 사랑하는 마음이어야 한다.\r\n\r\n나는 매일 아침 말씀을 묵상하고 기도하지만, 이것이 단순한 습관이나 해야 할 일이 되지 않았으면 좋겠다.\r\n\r\n나를 창조하시고, 구원하시고, 지금까지 나와 우리 가족을 지켜주신 하나님을 사랑하기 때문에 말씀을 읽고, 그 말씀대로 살아가기를 원하는 사람이 되고 싶다.\r\n\r\n말씀을 아는 것에서 끝나지 않고 실제 생활 속에서 순종해야겠다.\r\n\r\n말을 조심하라는 말씀을 받았으면 말을 조심하고, 하나님을 찬양하라는 말씀을 받았으면 실제로 찬양하며, 사람보다 하나님을 의지하라는 말씀을 받았으면 어려운 일이 생겼을 때 먼저 하나님께 기도하는 삶을 살아가야겠다.","status":"published","created_at":"2026-08-31T21:51:28.911Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":25,"title":"2026년9월14일(월) QT","content":"# 9월 14일 아침 말씀 묵상 – 신명기 20장\r\n\r\n오늘 신명기 20장은 이스라엘 백성이 전쟁을 앞두고 있을 때 하나님께서 주신 말씀이다.\r\n\r\n적군의 말과 병거와 군대가 자신들보다 많고 강해 보이더라도 두려워하지 말라고 하신다. 그 이유는 이스라엘의 힘이나 전력이 더 강하기 때문이 아니라 **하나님께서 그들과 함께하시기 때문**이다.\r\n\r\n오늘 말씀을 통해 나 역시 눈앞에 보이는 상황만 바라보지 않고, 나와 함께하시며 나의 삶을 인도하시는 하나님을 믿고 나아가야겠다고 다짐한다.\r\n\r\n## 1절 – 나보다 강해 보이는 상황을 두려워하지 말자\r\n\r\n“네가 나가서 적군과 싸우려 할 때에 말과 병거와 백성이 너보다 많음을 볼지라도 그들을 두려워하지 말라…”\r\n\r\n사람은 눈에 보이는 것을 보고 판단한다.\r\n\r\n이스라엘 백성이 전쟁터에서 자신들보다 많은 군사와 강한 병거를 바라보았다면 당연히 두려웠을 것이다.\r\n\r\n그러나 하나님께서는 먼저 **“두려워하지 말라”**고 말씀하신다.\r\n\r\n적이 약하기 때문이 아니다.\r\n\r\n이스라엘이 충분히 강하기 때문도 아니다.\r\n\r\n**하나님께서 함께하시기 때문이다.**\r\n\r\n이 말씀을 묵상하면서 나도 앞으로의 삶에서 내가 가진 조건이나 능력만 바라보지 않아야겠다는 생각이 든다.\r\n\r\n앞으로 새로운 직업을 찾거나 새로운 일을 시작하면서 현실적인 조건을 생각하면 걱정되는 부분이 있을 수 있다.\r\n\r\n나이와 경력, 새로운 환경에 적응해야 하는 문제, 내가 원하는 조건의 직장이 실제로 있을 것인지 등 여러 생각이 들 수 있다.\r\n\r\n그러한 것들을 바라보다 보면 마치 이스라엘 백성이 자신들보다 많은 병거와 군사를 바라보았던 것처럼 마음이 위축될 수도 ","status":"published","created_at":"2026-09-13T22:05:32.714Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":26,"title":"2026년9월15일(화) QT","content":"# 9월 15일 아침 말씀 묵상 – 신명기 23장\r\n\r\n오늘 신명기 23장은 이스라엘 공동체가 하나님 앞에서 어떻게 살아야 하는지를 여러 구체적인 규례를 통해 보여준다.\r\n\r\n오늘날 그대로 적용해야 하는 이스라엘의 시민법·의식법도 포함되어 있지만, 그 안에는 지금도 붙들 수 있는 중요한 원리가 있다.\r\n\r\n**하나님께서 함께하시는 백성은 삶의 자리에서 거룩함과 정직함을 지키고, 자신의 말과 약속에 책임을 지며, 다른 사람을 배려해야 한다는 것**이다.\r\n\r\n## 14절 – 하나님께서 내 삶 가운데 함께하신다\r\n\r\n“이는 네 하나님 여호와께서 너를 구원하시고 적군을 네게 넘기시려고 네 진중에 행하심이라…”\r\n\r\n오늘 가장 먼저 마음에 들어오는 말씀은 하나님께서 이스라엘의 진 가운데 행하신다는 말씀이다.\r\n\r\n하나님께서는 예배드릴 때만 함께하시는 분이 아니라 이스라엘 백성의 일상생활 가운데 함께하셨다.\r\n\r\n그들이 먹고 자고 이동하고 전쟁을 준비하는 모든 삶의 자리 가운데 하나님께서 함께하셨다.\r\n\r\n나도 이 말씀을 통해 하나님께서 나의 일상 가운데 함께하신다는 사실을 다시 기억하고 싶다.\r\n\r\n아침에 말씀을 묵상할 때만 하나님과 함께하는 것이 아니라, 혼자 시간을 보낼 때에도, 사람을 만날 때에도, 새로운 직업을 알아볼 때에도, 재정을 관리할 때에도 하나님께서 나와 함께하신다.\r\n\r\n그렇다면 중요한 것은 **“이 순간에도 하나님께서 나와 함께 계신다는 사실을 의식하며 살아가는 것”**이라는 생각이 든다.\r\n\r\n하나님의 임재를 의식한다면 말과 행동도 조금 달라질 것이다.\r\n\r\n다른 사람이 보지 않을 때에도 정직하게 행동하고, 내 욕심만을 따라가지 않으며, 하나님께서 기뻐","status":"published","created_at":"2026-09-14T23:48:16.589Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":28,"title":"2026년9월16일(수) QT","content":"# 9월 16일 아침 말씀 묵상 – 여호수아 1장\r\n\r\n모세가 죽은 후 하나님께서는 여호수아에게 이스라엘 백성을 이끌고 요단강을 건너 약속의 땅으로 들어가라고 명령하신다. 여호수아에게는 모세의 뒤를 이어 백성을 이끌어야 하는 큰 책임이 있었지만, 하나님께서는 그에게 반복해서 “강하고 담대하라”고 말씀하시며 함께하실 것을 약속하셨다.\r\n\r\n오늘 말씀을 통해 하나님께서 함께하심을 믿고, 말씀에 순종하며 내가 가야 할 길을 담대하게 걸어가야겠다고 다짐한다.\r\n\r\n## 5~7절 – 하나님께서 나와 함께하신다\r\n\r\n“내가 모세와 함께 있었던 것 같이 너와 함께 있을 것임이니라.”\r\n\r\n이 말씀은 어려서부터 많이 읽고 알고 있는 말씀이다. 하지만 오늘 다시 읽으면서 내가 이 말씀을 얼마나 실제 삶에서 믿고 있는지 돌아보게 된다.\r\n\r\n하나님께서는 여호수아에게 어려움이 없을 것이라고 말씀하지 않으셨다. 대신 어떤 상황에서도 함께하시겠다고 약속하셨다. 여호수아가 강하고 담대할 수 있었던 이유도 자신의 능력이 뛰어났기 때문이 아니라 하나님께서 함께하신다는 약속 때문이었다.\r\n\r\n나 역시 앞으로 어떤 길을 가게 될지 모두 알 수는 없다. 그러나 모든 것을 미리 아는 것보다 하나님께서 나와 함께하신다는 사실을 믿는 것이 더 중요하다. 지금까지 나를 인도하신 하나님께서 앞으로도 함께하실 것을 믿고 두려움보다 믿음을 선택해야겠다.\r\n\r\n## 8절 – 말씀을 묵상하고 그대로 행하라\r\n\r\n하나님께서는 여호수아에게 율법책을 입에서 떠나지 않게 하고 주야로 묵상하며 기록된 대로 행하라고 말씀하셨다.\r\n\r\n말씀을 많이 알고 있는 것과 말씀대로 살아가는 것은 다르다. 나 역시 매일 아침 말","status":"published","created_at":"2026-09-15T22:44:36.481Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":29,"title":"2026년9월17일(목) QT","content":"# 9월 17일 아침 말씀 묵상 – 여호수아 3~4장\r\n\r\n이스라엘 백성은 여호수아의 인도를 따라 요단강을 건너 약속의 땅으로 들어간다. 하나님께서는 언약궤를 멘 제사장들의 발이 요단강에 닿자 흐르던 물을 멈추게 하셨고, 백성들은 마른 땅을 밟고 강을 건넜다.\r\n\r\n그리고 열두 돌을 세워 후대의 자녀들에게 하나님께서 행하신 일을 기억하게 하셨다. 오늘 말씀을 통해 **하나님께서 함께하셨던 은혜를 기억하고, 그 믿음을 자녀들에게도 이어 주는 것**이 중요하다는 생각이 든다.\r\n\r\n## 4장 23절 – 변함없이 함께하시는 하나님\r\n\r\n“너희의 하나님 여호와께서 요단 물을 너희 앞에서 마르게 하사 너희를 건너게 하신 것이 너희의 하나님 여호와께서 우리 앞에 홍해를 말리시고 우리를 건너게 하심과 같았나니”\r\n\r\n모세 시대에는 홍해를 가르셨고, 모세가 죽은 후에는 여호수아를 통해 요단강을 건너게 하셨다. 지도자는 바뀌었지만 이스라엘을 인도하시는 하나님은 변하지 않으셨다.\r\n\r\n이 말씀을 보면서 나의 삶도 돌아보게 된다. 지금까지 여러 상황과 어려움을 지나왔지만 하나님께서 함께하시고 필요한 때마다 길을 열어 주셨다.\r\n\r\n그리고 나와 함께하셨던 하나님께서 나의 인생에서만 일하시는 분이 아니라는 생각이 든다. 우리 자녀들이 앞으로 어떤 길을 걷게 될지 부모인 나는 모두 알 수도 없고 대신 살아 줄 수도 없다. 그러나 **나와 함께하신 하나님께서 우리 자녀들의 인생에도 함께하시며 그들의 길을 인도하실 것**을 믿는다.\r\n\r\n내가 자녀들에게 줄 수 있는 가장 중요한 것은 모든 문제를 대신 해결해 주는 것이 아니라, 삶을 인도하시는 하나님을 믿는 믿음을 물려주는 것이라는 생각이 든다.\r\n","status":"published","created_at":"2026-09-16T22:50:40.402Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":30,"title":"2026년9월18일(금) QT","content":"# 9월 18일 아침 말씀 묵상 – 여호수아 9장\r\n\r\n여호수아 9장에서 기브온 주민들은 이스라엘에게 멸망당할 것을 두려워하여 아주 먼 곳에서 온 사람들처럼 꾸미고 여호수아를 찾아온다. 낡은 옷과 신발, 오래된 자루와 마른 떡까지 준비하여 자신들의 말을 믿게 만들었고, 결국 여호수아와 이스라엘 지도자들은 그들과 화친하고 맹세하였다. 그러나 사흘 뒤에야 그들이 가까운 곳에 사는 기브온 주민이라는 사실을 알게 된다.\r\n\r\n## 14절 – 여호와께 묻지 아니하고\r\n\r\n“무리가 그들의 양식을 취하고는 어떻게 할지를 여호와께 묻지 아니하고”\r\n\r\n오늘 말씀에서 가장 마음에 남는 구절이다.\r\n\r\n처음에는 하나님과 직접 소통하며 수많은 일을 경험했던 여호수아가 왜 하나님께 묻지 않고 이런 결정을 했을까 하는 생각이 들었다.\r\n\r\n그러나 한편으로는 여호수아의 판단도 이해가 된다. 기브온 주민들은 처음부터 이스라엘을 속이려고 작정하고 치밀하게 준비했다. 낡은 옷과 신발, 곰팡이 난 떡까지 보여 주었으니 여호수아의 눈에는 그들의 말이 사실처럼 보였을 것이다.\r\n\r\n문제는 여호수아가 눈에 보이는 것을 확인한 뒤 그것으로 판단을 끝내고, 하나님께 묻지 않은 채 너무 빨리 화친과 맹세까지 했다는 점이다.\r\n\r\n지금까지 하나님의 말씀에 순종하며 담대하게 이스라엘을 이끌었던 여호수아의 모습과는 조금 다르게 느껴진다. 동시에 이를 통해 여호수아 역시 실수할 수 있는 한 인간이었다는 사실을 보게 된다.\r\n\r\n하나님과 가까이 동행하는 사람이라 하더라도 모든 판단을 항상 바르게 하는 것은 아니다. 오히려 그렇기 때문에 매 순간 하나님께 묻고 하나님의 도우심을 구하는 것이 필요하다는 생각","status":"published","created_at":"2026-09-17T22:11:14.292Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":31,"title":"2026년9월19일(토) QT","content":"# 9월 19일 아침 말씀 묵상 – 여호수아 10장\r\n\r\n여호수아 10장에서는 기브온이 이스라엘과 화친했다는 소식을 들은 다섯 왕이 연합하여 기브온을 공격한다. 기브온 사람들은 여호수아에게 도움을 요청하고, 여호수아는 군대를 이끌고 그들을 돕기 위해 나아간다.\r\n\r\n하나님께서는 여호수아에게 “그들을 두려워하지 말라”고 말씀하시며 승리를 약속하셨고, 전쟁 가운데 직접 이스라엘을 위해 싸워 주셨다.\r\n\r\n## 8절 – 실수 이후에도 함께하시는 하나님\r\n\r\n앞선 9장에서 여호수아는 하나님께 묻지 않고 기브온 사람들과 화친하는 실수를 하였다. 그 결과 기브온이 공격받자 이스라엘은 그들을 돕기 위해 전쟁에 나서야 했다.\r\n\r\n그런데 하나님께서는 여호수아의 잘못된 판단을 책망하며 외면하지 않으시고 오히려 “두려워하지 말라”고 말씀하시며 그와 함께하셨다.\r\n\r\n이 모습을 보면서 하나님은 우리의 실수에도 불구하고 다시 하나님을 의지하며 나아갈 때 붙드시고 인도하시는 분이라는 생각이 든다.\r\n\r\n나 역시 과거의 잘못이나 아쉬운 선택에 계속 머무르기보다 그 경험을 통해 배우고 다시 하나님께 나아가야겠다.\r\n\r\n## 12~14절 – 해와 달을 멈추시며 이스라엘을 위해 싸우신 하나님\r\n\r\n전쟁이 계속되는 가운데 여호수아는 해와 달이 멈추기를 하나님께 구한다. 그리고 하나님께서는 그의 기도를 들으셔서 이스라엘이 원수를 충분히 물리칠 수 있도록 하셨다.\r\n\r\n여호수아의 잘못된 판단으로 시작된 상황이었음에도 하나님께서는 이스라엘을 버리지 않으셨다. 오히려 해와 달을 멈추게 하실 정도로 그들을 위해 싸워 주셨다.\r\n\r\n이 말씀을 묵상하면서 하나님의 위대하심과 능력을 다시 생각하","status":"published","created_at":"2026-09-18T22:33:28.155Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":32,"title":"2026년9월21일(월) QT","content":"9월21일 아치말씀 묵상 여호수아14장\r\n\r\n- 12절\\~14절: 갈렙의 신앙고백으로 하나님께서 함께 하시면 크고 견고한 성읍과 아낙사람들과의 전쟁에서 승리할수 있고, 그 땅과 산지를 취할 수 있다고 고백함. 아무리 어렵고 힘든 일이나 상황도 하나님이 함께 하시면 아무것도 아니고 해결된다는 믿음을 갖기를 원합니다.\r\n- 퇴사후 2개월정도 지나가는 시점입니다. 채용공고를 수시로 보면서 조급해지는 모습이 있다. 내가 26년 직장생활하면서 영업성과에 시달리고, kpi목표달성에 스트레스 받고, 새로운 직장은 영업스트레스가 없고 신앙생활에 지장이 없는 직업/직장을 가지겠다는 마음을 잊어버리는 모습이 나온다. 충분한 금융자산이 있는데, 욕심이 생기고, 주위의 시선에 뭔가 빨리 직장에 나가야겠다는 생각에 조급해지는 모습을 본다. 인생의 소중한 휴식기에 내가 하나님과 더 가까워지고, 신앙이 성장하고, 몸과 마음이 건강해지는게 더 중요하다. 조급하지 말고, 인도하실 하나님을 의지하며 나아가자","status":"published","created_at":"2026-09-20T22:20:13.416Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":true},{"id":33,"title":"2026년 9월28일(월)QT","content":"# 9월 28일 아침 말씀 묵상 – 여호수아 21장\r\n\r\n여호수아 21장에서는 레위 지파가 이스라엘 각 지파로부터 성읍과 목초지를 분배받는다. 레위 지파는 다른 지파처럼 한 지역을 기업으로 받은 것이 아니라 이스라엘 전역에 흩어져 하나님을 섬기는 역할을 감당하게 되었다.\r\n\r\n그리고 장 마지막에는 하나님께서 이스라엘에게 약속하신 것을 어떻게 이루셨는지가 정리되어 있다.\r\n\r\n## 43절 – 하나님께서 약속하신 것을 주심\r\n\r\n“여호와께서 이스라엘의 조상들에게 맹세하여 주리라 하신 온 땅을 이와 같이 이스라엘에게 다 주셨으므로…”\r\n\r\n이스라엘 백성이 가나안 땅에 들어오기까지 오랜 시간이 걸렸다. 애굽에서 나와 광야를 지나고, 요단강을 건너고, 여러 전쟁을 치른 뒤에야 약속의 땅을 차지하게 되었다.\r\n\r\n과정만 보면 매우 길고 힘들었지만 결국 하나님께서는 약속하신 것을 이루셨다.\r\n\r\n이 말씀을 보면서 하나님의 약속은 내가 생각하는 시간표대로 이루어지지 않을 수 있지만, 하나님께서는 자신의 때와 방법으로 말씀하신 것을 이루시는 분이라는 생각이 든다.\r\n\r\n나 역시 앞으로의 길이 빨리 보이지 않을 때 조급해질 수 있다. 그러나 지금 당장 결과가 보이지 않는다고 해서 하나님께서 아무 일도 하지 않고 계신 것은 아니다.\r\n\r\n과거에 이스라엘을 인도하셨던 것처럼 나의 삶도 하나님의 시간 안에서 진행되고 있음을 믿고 싶다.\r\n\r\n## 44절 – 안식을 주신 하나님\r\n\r\n“여호와께서 그들의 주위에 안식을 주셨으되…”\r\n\r\n이 말씀도 마음에 남는다.\r\n\r\n이스라엘은 오랜 광야생활과 전쟁을 지나 마침내 안식을 누리게 되었다. 하나님께서는 땅만 주신 것이 아니라 그들이 머물며 살아","status":"published","created_at":"2026-09-27T22:07:36.312Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":34,"title":"2026년9월29일(화)QT","content":"# 9월 29일 아침 말씀 묵상 – 여호수아 23장\r\n\r\n여호수아는 가나안 정복전쟁이 어느 정도 마무리되고 이스라엘이 안식을 누리게 된 후 지도자들을 불러 마지막으로 권면한다.\r\n\r\n여호수아가 강조하는 것은 자신이 얼마나 많은 전쟁을 잘 치렀는지가 아니었다. 지금까지 이스라엘을 위해 싸우신 분은 하나님이셨으며, 앞으로도 이스라엘이 하나님의 말씀을 지키고 하나님만 의지해야 한다는 것이었다.\r\n\r\n## 3절 – 너희를 위하여 싸우신 이는 하나님이시다\r\n\r\n“너희의 하나님 여호와 그는 너희를 위하여 싸우신 이시니라.”\r\n\r\n여호수아는 지난 시간을 돌아보면서 이스라엘이 가나안 땅을 얻을 수 있었던 이유를 분명하게 말한다.\r\n\r\n이스라엘의 군사력이 강했기 때문이 아니라 하나님께서 그들을 위해 싸우셨기 때문이다.\r\n\r\n여리고 성을 무너뜨리신 것도, 요단강을 건너게 하신 것도, 여러 왕들과의 전쟁에서 승리하게 하신 것도 결국 하나님의 도우심이었다.\r\n\r\n이 말씀을 보면서 나도 지금까지 살아온 시간을 돌아보게 된다.\r\n\r\n내가 노력하고 선택하며 살아왔지만, 그 과정 가운데 하나님께서 지켜 주시고 어려운 순간마다 길을 열어 주셨던 은혜가 있었다.\r\n\r\n지금까지의 삶을 내 능력과 노력으로만 설명하지 않고, 보이지 않는 가운데 함께하시고 인도하신 하나님의 손길을 기억해야겠다.\r\n\r\n## 6절 – 말씀을 지켜 행하라\r\n\r\n여호수아는 이스라엘 백성에게 “크게 힘써 모세의 율법책에 기록된 것을 다 지켜 행하라”고 권면한다.\r\n\r\n전쟁이 끝나고 평안한 시간이 찾아왔지만 여호수아는 오히려 그때 말씀을 더욱 잘 지키라고 한다.\r\n\r\n어려울 때는 하나님을 간절히 찾지만 상황이 편안해지","status":"published","created_at":"2026-09-28T22:11:36.501Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":35,"title":"2026년10월2일(금)QT","content":"# 10월 2일 아침 말씀 묵상 – 사사기 6장\r\n\r\n사사기 6장에서는 이스라엘 백성이 다시 하나님 앞에서 악을 행하고, 그 결과 미디안의 압제를 받게 된다. 미디안 사람들은 이스라엘의 소산을 빼앗고 삶을 어렵게 만들었으며, 결국 이스라엘 백성은 하나님께 부르짖는다.\r\n\r\n하나님께서는 그들의 부르짖음을 들으시고 기드온을 세워 다시 이스라엘을 구원하고자 하신다. 오늘 말씀을 통해 반복해서 하나님을 떠나는 이스라엘의 모습과, 그럼에도 다시 구원의 길을 열어 주시는 하나님의 은혜를 함께 보게 된다.\r\n\r\n## 반복해서 하나님을 떠나는 이스라엘\r\n\r\n이스라엘 백성은 하나님께서 베풀어 주신 구원을 여러 번 경험했음에도 평안해지면 다시 하나님을 떠나고 우상을 섬겼다. 그러다가 어려움이 찾아오면 하나님께 부르짖었고, 하나님께서는 다시 그들을 구원하셨다.\r\n\r\n이 모습을 보면서 나 자신의 신앙생활도 돌아보게 된다.\r\n\r\n나 역시 이스라엘 백성과 크게 다르지 않은 모습을 보일 때가 많다. 평안하고 특별한 어려움이 없을 때에는 말씀 묵상과 기도를 게을리하다가, 힘든 문제가 생기면 그제야 하나님께 간절히 매달리는 일이 반복될 때가 있다.\r\n\r\n하나님께 받은 은혜를 기억한다고 하면서도 시간이 지나면 쉽게 잊고 다시 내 생각대로 살아가는 모습을 발견한다.\r\n\r\n오늘 말씀을 통해 어려울 때만 하나님을 찾는 신앙에서 벗어나야겠다는 생각이 든다. 평안할 때에도 하나님을 가까이하고, 매일 말씀과 기도를 통해 하나님과 동행하는 것이 성숙한 신앙의 모습일 것이다.\r\n\r\n## 기드온을 세워 일하시는 하나님\r\n\r\n하나님께서는 미디안의 압제 가운데 있는 이스라엘을 구원하기 위해 기드온을 부르","status":"published","created_at":"2026-10-01T22:02:46.336Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":36,"title":"2026년10월1일(목) QT","content":"# 10월 1일 아침 말씀 묵상 – 사사기 5장\r\n\r\n사사기 5장은 드보라와 바락이 가나안 왕 야빈의 군대를 물리친 후 하나님께 드린 찬양이다. 여호수아 이후 이스라엘 백성은 점차 하나님을 잊고 살아갔고, 그 결과 주변 민족의 압제를 받게 되었다. 그러나 하나님께서는 이스라엘이 부르짖을 때 사사를 세우셔서 다시 구원하셨다.\r\n\r\n이 말씀을 보면서 한 세대가 하나님을 잘 믿는 것만으로 끝나서는 안 된다는 생각이 든다. 부모님의 신앙이 나에게 이어졌듯이, 나의 믿음도 우리 자녀들에게 자연스럽게 이어져 우리 가족이 대를 이어 하나님을 섬기는 믿음의 가정이 되기를 소망한다.\r\n\r\n## 9절 – 즐거이 헌신하는 사람\r\n\r\n“내 마음이 이스라엘의 방백을 사모함은 그들이 백성 중에서 즐거이 헌신하였음이라 여호와를 찬송하라.”\r\n\r\n오늘 특별히 마음에 남는 말씀이다.\r\n\r\n이스라엘이 어려움 가운데 있을 때 자신의 자리에서 자원하여 나선 사람들이 있었다. 억지로 끌려간 것이 아니라 즐거이 헌신하였다.\r\n\r\n나 역시 하나님께서 내게 맡기신 일을 마지못해 감당하기보다 감사한 마음으로 하고 싶다. 교회에서 맡은 일이나 가정에서의 역할, 앞으로 새롭게 맡게 될 일도 하나님께서 허락하신 자리라는 생각으로 성실하게 감당하고 싶다.\r\n\r\n하나님께서 인도하시기를 기다리는 것도 중요하지만, 기다린다는 이유로 아무것도 하지 않는 것은 아닐 것이다. 내가 해야 할 준비를 하고, 기회가 있다면 살펴보고, 하나님께서 주시는 자리인지 기도하며 한 걸음씩 나아가는 것도 믿음의 모습이라는 생각이 든다.\r\n\r\n## 31절 – 주를 사랑하는 자들은 해가 힘 있게 돋음 같게 하소서\r\n\r\n“주를 사랑하는 자들은 해가 ","status":"published","created_at":"2026-10-01T22:04:06.203Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":37,"title":"2026년 10월7일(수) QT","content":"# 10월 7일 아침 QT – 사사기 10장\r\n\r\n이스라엘 백성은 다시 하나님을 떠나 바알과 아스다롯을 비롯한 이방 신들을 섬겼고, 그 결과 블레셋과 암몬의 압제를 받게 된다. 고통 가운데 이스라엘은 자신들의 죄를 인정하며 하나님께 부르짖는다.\r\n\r\n하나님께서는 그동안 여러 번 구원해 주셨음에도 다시 자신을 버린 이스라엘을 책망하신다. 그러나 이스라엘 백성이 이방 신들을 제거하고 하나님만 섬기자, 하나님께서는 그들의 곤고함으로 인해 마음에 근심하신다.\r\n\r\n## 반복해서 하나님을 떠나는 이스라엘\r\n\r\n이스라엘은 하나님의 구원을 여러 번 경험했지만 평안해지면 다시 하나님을 떠났다. 그리고 고난이 찾아오면 다시 하나님께 부르짖었다.\r\n\r\n이 모습을 보면서 나 역시 크게 다르지 않다는 생각이 든다.\r\n\r\n나도 평안할 때에는 말씀과 기도생활이 느슨해질 때가 있고, 어려움이나 걱정거리가 생기면 하나님께 더 간절히 매달린다.\r\n\r\n그러나 어려움 속에서 하나님께 간구하고 매달리는 것 자체가 잘못된 것은 아니라고 생각한다. 하나님의 자녀가 힘든 일을 만났을 때 아버지이신 하나님께 도움을 구하는 것은 당연한 일이다.\r\n\r\n문제는 어려움이 지나간 후 하나님을 다시 잊어버리는 것이다. 고난 가운데서만 하나님을 찾는 것이 아니라 평안할 때에도 하나님을 마음의 중심에 모시며 살아가는 신앙이 필요하다는 생각이 든다.\r\n\r\n## 16절 – 그들의 곤고로 말미암아 마음에 근심하시니라\r\n\r\n오늘 가장 마음에 남는 말씀이다.\r\n\r\n이스라엘 백성은 반복해서 하나님을 떠났지만, 그들이 진심으로 회개하고 다시 하나님께 돌아오자 하나님께서는 그들의 고통을 외면하지 않으셨다.\r\n\r\n“그들의 곤고","status":"published","created_at":"2026-10-06T22:09:32.420Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":38,"title":"2026년 10월13일(화)","content":"# 10월 12일 아침 말씀 묵상 – 사사기 12장\r\n\r\n사사기 12장에서는 입다와 에브라임 지파 사이의 갈등이 동족 간의 전쟁으로 이어지고, 이후 입다의 생애가 끝난 뒤 입산, 엘론, 압돈이 차례로 사사가 되어 이스라엘을 다스린다.\r\n\r\n오늘 말씀을 읽으며 입다의 시대가 끝나도 하나님께서는 이스라엘을 그대로 두지 않으시고 계속해서 사사를 세워 백성을 돌보셨다는 사실이 마음에 남는다.\r\n\r\n## 입다의 딸을 통해 생각하는 순종\r\n\r\n앞장인 사사기 11장에서 입다의 딸은 아버지가 하나님께 한 서원을 알게 된 뒤 그 결과를 받아들이는 모습을 보인다.\r\n\r\n입다의 서원 자체에 대해서는 여러 가지로 생각해 볼 부분이 있지만, 딸이 보여 준 태도에서는 자신에게 닥친 상황을 받아들이는 순종의 모습을 보게 된다.\r\n\r\n나도 하나님의 뜻에 순종한다고 말하지만, 실제로 내가 원하는 방향과 하나님의 인도하심이 다를 때에도 순종할 수 있는지 돌아보게 된다.\r\n\r\n내가 원하는 것을 하나님께 이루어 달라고 요구하는 신앙보다, 하나님의 뜻을 구하고 그 뜻에 나를 맞추어 가는 신앙인이 되고 싶다.\r\n\r\n## 입다 이후에도 사사를 세우시는 하나님\r\n\r\n입다가 죽은 후 이스라엘의 역사는 끝나지 않았다.\r\n\r\n하나님께서는 입산을 세우셨고, 그 뒤에는 엘론과 압돈을 세우셔서 계속해서 이스라엘을 다스리게 하셨다.\r\n\r\n이 부분을 보면서 사람은 바뀌지만 하나님의 일하심은 계속된다는 생각이 든다.\r\n\r\n여호수아가 죽은 뒤에도 하나님께서는 사사들을 세우셨고, 한 사사의 시대가 끝나면 또 다른 사람을 세우셔서 이스라엘을 보호하셨다.\r\n\r\n이스라엘 백성은 반복해서 하나님을 떠나고 잘못을 범했지만, 하나님께서는 ","status":"published","created_at":"2026-10-12T22:28:25.192Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":39,"title":"2026년10월14일(수)","content":"# 10월 14일 아침 말씀 묵상 – 사사기 13장\r\n\r\n사사기 13장은 이스라엘이 블레셋의 지배를 받고 있던 때에 하나님께서 삼손의 출생을 미리 준비하시는 장면이다. 이스라엘의 눈에는 아직 아무 변화가 없었지만 하나님께서는 이미 구원의 일을 시작하고 계셨다.\r\n\r\n오늘 말씀을 통해 내가 보지 못한다고 해서 하나님께서 아무 일도 하지 않고 계신 것은 아니라는 사실을 다시 생각하게 된다.\r\n\r\n## 3~5절 – 내가 알기 전에 준비하시는 하나님\r\n\r\n하나님께서는 마노아의 아내에게 나타나 아들을 낳게 될 것이며, 그 아이가 이스라엘을 블레셋의 손에서 구원하기 시작할 것이라고 말씀하셨다.\r\n\r\n이스라엘 백성이 아직 알지 못하는 가운데 하나님께서는 이미 삼손을 준비하고 계셨다.\r\n\r\n퇴직한 지 약 3개월이 지나면서 마음은 이전보다 평안해졌지만, 한편으로는 앞으로 새로운 직장을 갖지 못하면 어떻게 하나 하는 걱정이 조금씩 생긴다. 생활 자체가 급박한 것은 아니지만 계속 일하고 있는 아내를 보면 미안한 마음도 들고, 주변의 시선도 신경 쓰인다.\r\n\r\n그래서 재취업을 서둘러야 하나, 지금처럼 투자와 다른 활동을 하면서 살아가도 괜찮은가 하는 여러 생각이 생긴다.\r\n\r\n하지만 오늘 말씀을 보면서 내가 지금 답을 다 알고 있어야 하는 것은 아니라는 생각이 든다. 이스라엘이 알지 못하는 동안에도 하나님께서 이미 구원의 사람을 준비하셨던 것처럼, 나 역시 아직 보지 못할 뿐 하나님께서 앞으로의 길을 준비하고 계실 수 있다.\r\n\r\n## 18절 – “내 이름은 기묘자라”\r\n\r\n마노아가 여호와의 사자에게 이름을 묻자 그는 “내 이름은 기묘자라”고 대답한다.\r\n\r\n이번 말씀을 통해 사사기에 등장하는 여","status":"published","created_at":"2026-10-13T23:20:56.557Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":40,"title":"2026년10월16일(금) QT","content":"# 10월 16일 아침 말씀 묵상 – 룻기 1~4장\r\n\r\n룻기는 사사 시대에 한 가정이 겪은 어려움과 회복의 과정을 통해 하나님의 섭리를 보여주는 말씀이다.\r\n\r\n나오미는 남편과 두 아들을 잃고 고향 베들레헴으로 돌아온다. 모압 여인 룻은 시어머니를 떠나지 않고 함께 베들레헴으로 향한다. 룻은 생계를 위해 이삭을 주우러 나갔다가 보아스를 만나게 되고, 이후 보아스와 결혼하여 다윗 왕의 조상이 된다.\r\n\r\n## 룻기 1장 16절 – 믿음으로 선택한 룻\r\n\r\n“어머니의 백성이 나의 백성이 되고 어머니의 하나님이 나의 하나님이 되시리니”\r\n\r\n룻은 아브라함의 조카 롯의 후손인 모압 여인이었다. 남편이 죽은 후 고향에 남을 수도 있었지만, 나오미를 따라 낯선 베들레헴으로 가기로 결정한다.\r\n\r\n룻은 앞으로 어떻게 살아갈지, 어떤 일이 기다리고 있을지 알지 못했다. 그러나 시어머니를 향한 사랑과 이스라엘의 하나님을 자신의 하나님으로 받아들이는 믿음으로 새로운 길을 선택하였다.\r\n\r\n이 모습을 보면서 믿음은 모든 결과를 알고 나아가는 것이 아니라, 하나님을 신뢰하며 한 걸음씩 나아가는 것이라는 생각이 든다.\r\n\r\n## 룻기 2장 3절 – 우연처럼 보이는 하나님의 섭리\r\n\r\n“우연히 엘리멜렉의 친족 보아스에게 속한 밭에 이르렀더라.”\r\n\r\n오늘 가장 마음에 남는 말씀이다.\r\n\r\n룻은 자신과 나오미의 생계를 위해 이삭을 주우러 나갔다. 그런데 우연히 들어간 밭이 나오미 집안의 친족인 보아스의 밭이었다.\r\n\r\n룻의 입장에서는 우연한 일이었겠지만, 룻기 전체를 보면 하나님의 섭리 가운데 이루어진 만남이었다는 생각이 든다.\r\n\r\n룻은 자신이 보아스를 만나게 될 것이라는 사실도, 그를 통해 새로","status":"published","created_at":"2026-10-15T22:02:14.807Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":41,"title":"2026년10월19일(금) QT","content":"# 10월 19일 아침 말씀 묵상\r\n**본문: 사무엘상 1~4장**\r\n\r\n오늘 말씀을 읽으면서 하나님께 드리는 제사를 가볍게 여겼던 엘리의 두 아들 홉니와 비느하스의 모습이 마음에 남는다.\r\n\r\n그들은 제사장의 직분을 맡고 있으면서도 하나님을 경외하지 않았고, 하나님께 드리는 제물까지 자신의 욕심을 채우는 데 사용하였다. 사무엘상 2장 17절에서는 그들이 여호와의 제사를 멸시하였다고 말씀한다.\r\n\r\n이 말씀을 묵상하면서 자연스럽게 내가 주일예배를 드리는 모습을 돌아보게 되었다.\r\n\r\n나는 오랫동안 교회에 다니면서 매주 주일예배를 드려 왔다. 예배에 참석하는 것을 당연하게 생각했고, 나름대로 신앙생활을 성실하게 하고 있다고 생각했다. 그러나 정작 하나님께 드리는 예배를 얼마나 간절한 마음으로 준비했는지 생각해 보면 부족한 부분이 많았던 것 같다.\r\n\r\n주일 아침에도 평소와 다름없이 일어나 다른 일들을 생각하다가 시간이 되면 교회에 가고, 예배를 드리면서도 때로는 여러 생각에 마음을 빼앗겼던 것 같다. 하나님을 만나러 간다는 기쁨과 기대보다는 매주 반복되는 익숙한 일처럼 예배를 드린 것은 아닌지 돌아보게 된다.\r\n\r\n엘리의 아들들처럼 제사를 멸시한 것은 아니지만, 나 역시 익숙함 속에서 하나님께 드리는 예배의 소중함을 조금씩 잊고 있었던 것은 아닌가 하는 생각이 든다.\r\n\r\n반면 한나는 자신의 아픔과 간절한 소망을 하나님께 온전히 쏟아 놓았고, 어린 사무엘은 하나님의 부르심에 귀를 기울이며 “말씀하옵소서 주의 종이 듣겠나이다”라고 응답하였다.\r\n\r\n나는 어려운 일이 있을 때에는 하나님께 간절히 기도하며 도움을 구했지만, 평안한 일상 가운데서는 그만큼 간절한 ","status":"published","created_at":"2026-10-18T22:05:09.588Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":43,"title":"2026년10월23일(금) QT","content":"# 10월 23일 아침 말씀 묵상\r\n**본문: 사무엘상 12장 20~24절**\r\n\r\n오늘 말씀에서 사무엘은 하나님 앞에 악을 행했던 이스라엘 백성에게 두려워하지 말고 마음을 다하여 하나님을 섬기며, 유익하게 하지도 못하고 구원하지도 못하는 헛된 것을 따르지 말라고 권면한다.\r\n\r\n특히 24절의 “너희는 여호와께서 너희를 위하여 행하신 그 큰 일을 생각하여 오직 그를 경외하며 너희의 마음을 다하여 진실히 섬기라”는 말씀이 마음에 남는다.\r\n\r\n이 말씀을 묵상하면서 요즘 내가 무엇에 가장 많은 관심과 시간을 쏟고 있는지 돌아보게 된다.\r\n\r\n퇴직 후 평안한 시간을 보내고 있지만, 요즘은 주식거래에 많은 마음과 정신을 쏟고 있는 것 같다. 아침부터 주식시장을 확인하고 매수와 매도 시점을 고민하며, 주가의 움직임에 따라 하루의 기분과 생각이 영향을 받기도 한다.\r\n\r\n주식투자도 자산을 관리하고 경제활동을 하는 하나의 방법이지만, 내 마음이 온통 그곳에만 향하고 있다면 하나님을 삶의 중심에 모시고 있다고 말하기 어려울 것 같다.\r\n\r\n곰곰이 생각해 보면 지금 당장 주식거래로 돈을 벌지 않아도 생활하는 데 큰 어려움이 있는 것은 아니다. 새로운 직장을 반드시 구해야만 하는 상황도 아니다. 그런데도 무엇인가 일을 해서 돈을 벌어야 한다는 생각이 내 마음을 계속 붙잡고 있는 것 같다.\r\n\r\n오랜 직장생활 동안 성과와 실적으로 평가받으며 살아오다 보니, 퇴직한 지금도 나의 가치를 얼마나 돈을 벌고 어떤 일을 하고 있는지로 판단하고 있는 것은 아닌지 생각하게 된다.\r\n\r\n아내는 여전히 직장에 다니고 있고, 나는 퇴직 후 쉬고 있다는 사실 때문에 미안한 마음도 있다. 주변 사람들이 나를 어떻게 바라","status":"published","created_at":"2026-10-22T22:07:02.493Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":44,"title":"2026년10월26일(월)QT","content":"# 10월 26일 아침 말씀 묵상\r\n**본문: 사무엘상 15~16장**\r\n\r\n오늘 말씀에서 사울이 하나님의 명령에 불순종하여 왕으로서 버림받고, 하나님께서 다윗을 새로운 왕으로 선택하시는 모습을 보게 된다.\r\n\r\n특히 죄를 범한 이후 사울과 다윗이 보여 준 서로 다른 태도가 마음에 남는다.\r\n\r\n다윗도 밧세바를 취하고 우리아를 죽음에 이르게 하는 큰 죄를 저질렀지만, 나단 선지자의 책망을 듣고 자신의 죄를 인정하며 하나님 앞에 깊이 회개하였다.\r\n\r\n반면 사울은 사무엘의 책망을 듣고 자신의 죄를 인정하면서도 백성에게 책임을 돌리고 변명하였다. 특히 15장 30절에서는 백성과 장로들 앞에서 자신을 높여 달라고 사무엘에게 부탁한다.\r\n\r\n사울은 하나님께 범죄한 사실보다 자신의 왕권과 체면을 잃는 것을 더 두려워했던 것은 아닐까 생각하게 된다.\r\n\r\n**사울도 다윗처럼 하나님 앞에 엎드려 진심으로 회개했다면, 자비로우신 하나님께서는 그를 용서하셨을 것이라고 믿는다.** 물론 왕의 자리를 계속 지킬 수 있었을지는 알 수 없다.\r\n\r\n이 말씀을 통해 하나님께서 원하시는 것은 죄 없는 완벽한 사람이 아니라, 자신의 죄를 깨닫고 겸손히 하나님께 돌아오는 사람이라는 사실을 생각하게 된다.\r\n\r\n나 역시 살아가면서 크고 작은 죄를 범하고, 때로는 내 잘못을 인정하기보다 변명하거나 다른 사람들의 시선을 의식할 때가 있다.\r\n\r\n사무엘상 16장 7절에서 하나님께서는 사람의 외모가 아니라 중심을 보신다고 말씀하신다.\r\n\r\n오랫동안 직장생활을 하면서 사람들의 평가와 인정에 신경을 쓰며 살아왔지만, 이제는 다른 사람들에게 어떻게 보이는가보다 하나님 앞에서 내 마음이 어떠한지를 더 중요하게 생각하","status":"published","created_at":"2026-10-25T22:01:36.473Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":46,"title":"2026년10월27일(화)QT","content":"# 10월 27일 아침 말씀 묵상\r\n**본문: 사무엘상 17~19장, 시편 59편 16~17절**\r\n\r\n오늘 말씀은 다윗이 골리앗을 물리친 이후 사울의 시기와 질투로 생명의 위협을 받게 되는 내용이다. 그러나 어려운 상황에서도 하나님께서는 다윗과 함께하셨고, 다윗은 지혜롭게 행동하며 위기를 이겨 나갔다.\r\n\r\n특히 사무엘상 18장 14절의 말씀이 마음에 남는다.\r\n\r\n**“다윗이 그의 모든 일을 지혜롭게 행하니라 여호와께서 그와 함께 계시니라.”**\r\n\r\n다윗은 골리앗을 물리친 이후에도 교만해지지 않고 자신에게 맡겨진 일을 지혜롭게 감당하였다. 사울이 자신을 시기하고 죽이려 하는 상황에서도 하나님께서는 다윗과 함께하셨다.\r\n\r\n이 말씀을 읽으면서 나의 하루를 돌아보게 된다.\r\n\r\n나는 매일 살아가면서 크고 작은 선택을 하고, 사람들을 만나 대화하며, 여러 가지 일을 판단하고 결정한다. 그때마다 내 경험과 생각만을 의지하지 않고 하나님께서 주시는 지혜를 구하며 살아가고 싶다.\r\n\r\n특히 말을 하거나 행동하기 전에 잠시라도 하나님을 생각하고, 내 말과 행동이 하나님 보시기에 합당한지 돌아보는 습관을 갖고 싶다.\r\n\r\n하나님께서 다윗과 함께하셨던 것처럼 오늘도 나와 동행하시며, 내가 하는 모든 일에 지혜를 주시기를 기도한다.\r\n\r\n또한 시편 59편 16~17절에서 다윗은 자신을 죽이려는 사람들의 위협 가운데서도 하나님을 찬양한다.\r\n\r\n**“주는 나의 요새이시며 나의 환난 날에 피난처심이니이다.”**\r\n\r\n다윗은 어려움이 없는 평안한 상황에서만 하나님을 찬양한 것이 아니었다. 자신의 생명이 위협받는 순간에도 하나님을 의지하며 그분의 인자하심을 노래하였다.\r\n\r\n이 모습을 보면서 나 역시 상황에","status":"published","created_at":"2026-10-26T22:01:59.955Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":47,"title":"2026년10월28일(수)QT","content":"# 10월 28일 아침 말씀 묵상\r\n**본문: 사무엘상 21장, 시편 34편**\r\n\r\n오늘 말씀에서는 사울에게 쫓기던 다윗이 가드 왕 아기스 앞에서 생명의 위협을 느껴 미친 사람처럼 행동하며 위기를 벗어나는 모습을 보게 된다.\r\n\r\n다윗은 하나님께 기름 부음 받은 사람이었지만, 그 역시 두려움과 어려움 앞에서는 연약한 인간이었다. 그러나 다윗은 위기 가운데 자신을 건져 주신 하나님을 찬양하며 시편 34편을 통해 하나님의 은혜를 고백한다.\r\n\r\n특히 시편 34편 9~10절 말씀이 마음에 남는다.\r\n\r\n**“너희 성도들아 여호와를 경외하라 그를 경외하는 자에게는 부족함이 없도다. 여호와를 찾는 자는 모든 좋은 것에 부족함이 없으리로다.”**\r\n\r\n하나님을 경외한다는 것은 무엇일까?\r\n\r\n하나님의 크고 위대하심을 인정하고, 나의 모든 삶을 주관하시는 분이 하나님이심을 믿는 것이라고 생각한다. 또한 하나님은 나의 아버지이시기에, 자녀가 아버지에게 자신의 어려움과 바람을 이야기하듯 나 역시 삶의 모든 일을 하나님께 말씀드리며 도움과 인도하심을 구하는 것이 아닐까 생각하게 된다.\r\n\r\n다윗은 생명의 위협 앞에서 하나님을 찾았고, 하나님께서 자신의 두려움에서 건져 주셨음을 고백하였다.\r\n\r\n나 역시 지금까지 살아오면서 어려운 순간마다 하나님께 기도하며 도움을 구했고, 지나온 시간을 돌아보면 하나님께서 여기까지 나를 지켜 주시고 인도해 주셨음을 고백하게 된다.\r\n\r\n최근 재취업을 준비하면서 내가 바라던 조건에 비교적 잘 맞는 서민금융진흥원 금융전문직 채용공고를 보게 되었다.\r\n\r\n급여는 그동안 생각했던 기준보다 다소 낮지만, 영업실적에 대한 압박이 적고 정시 출퇴근이 가능하며 신앙","status":"published","created_at":"2026-10-27T21:44:06.513Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":48,"title":"2026년10월30일(목)QT","content":"# 10월 30일 아침 말씀 묵상\r\n**본문: 사무엘상 23~24장, 시편 57편**\r\n\r\n오늘 말씀에서는 사울에게 쫓기는 다윗이 어려운 상황에서도 하나님께 묻고, 하나님의 뜻에 따라 행동하는 모습을 보게 된다.\r\n\r\n다윗은 그일라를 구하러 가야 할지, 사울의 위협을 피해 어떻게 해야 할지 하나님께 여쭈었다. 하나님께서는 다윗에게 응답하셨고, 다윗은 그 말씀에 따라 행동하였다.\r\n\r\n이러한 다윗의 모습을 보면서 하나님께서 왜 다윗을 마음에 합한 사람이라고 하셨는지 조금은 알 것 같다.\r\n\r\n사울은 키가 크고 용모가 준수하여 사람들의 눈에는 왕으로서 훌륭한 자질을 갖춘 사람으로 보였을 것이다. 그러나 사울은 점차 하나님의 말씀보다 자신의 생각과 사람들의 시선을 앞세웠다.\r\n\r\n반면 다윗은 어려운 상황에서도 자신의 판단에만 의지하지 않고 먼저 하나님의 뜻을 구하였다.\r\n\r\n특히 사무엘상 24장에서 다윗은 사울을 죽일 수 있는 기회를 얻게 된다. 자신을 죽이려고 쫓아다니는 사울을 제거한다면 오랜 도피 생활을 끝낼 수도 있었을 것이다. 주변 사람들도 하나님께서 주신 기회라고 생각했지만, 다윗은 하나님께서 기름 부어 세우신 왕을 자신의 손으로 해쳐서는 안 된다고 생각하고 사울을 살려 보낸다.\r\n\r\n이 모습을 보면서 **내게 유리한 기회라고 해서 반드시 하나님께서 허락하신 길은 아닐 수 있다**는 사실을 깨닫는다.\r\n\r\n다윗은 자신의 어려움을 해결할 수 있는 기회 앞에서도 하나님을 경외하는 마음을 잃지 않았다. 이러한 다윗의 믿음과 순종을 조금이라도 닮고 싶다.\r\n\r\n나 역시 살아가면서 중요한 일을 결정할 때 하나님께 기도하고 그 뜻을 구하려고 한다. 그러나 때로는 내가 이미 원하는 방향","status":"published","created_at":"2026-10-29T21:23:21.719Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":49,"title":"2026년11월2일(월)QT","content":"# 11월 2일 아침 말씀 묵상\r\n**본문: 시편 54편**\r\n\r\n오늘 말씀은 다윗이 사울에게 쫓기던 중 십 사람들의 밀고로 위기에 처했을 때 하나님께 드린 기도이다.\r\n\r\n다윗은 생명의 위협을 받는 어려운 상황에서도 하나님께 자신의 마음을 솔직하게 아뢰며 도움을 구하였다.\r\n\r\n**“하나님이여 내 기도를 들으시며 내 입의 말에 귀를 기울이소서.” (2절)**\r\n\r\n다윗은 하나님께서 자신의 기도를 들으시고 도와주실 것을 믿었다.\r\n\r\n나 역시 살아오면서 어려운 일을 만날 때마다 하나님께 기도하며 도움을 구해 왔다. 지나온 삶을 돌아보면 하나님께서 여러 어려움 가운데 나를 지켜 주시고 여기까지 인도하셨음을 고백하게 된다.\r\n\r\n특히 4절 말씀이 오늘 내 마음에 깊이 다가온다.\r\n\r\n**“하나님은 나를 돕는 이시며 주께서는 내 생명을 붙들어 주시는 이시니이다.”**\r\n\r\n하나님은 나를 도우시고 내 삶을 붙들어 주시는 분이시다. 오늘도 나와 우리 가족을 도와주시기를 간절히 기도한다.\r\n\r\n오늘 서민금융진흥원 금융전문직에 입사지원서를 제출하려고 한다.\r\n\r\n이곳은 그동안 내가 바라왔던 새로운 직장의 조건에 비교적 잘 맞는 곳이다. 급여는 이전 직장보다 적지만 영업실적에 대한 압박이 적고, 정시 출퇴근이 가능하며, 업무 스트레스도 상대적으로 크지 않을 것으로 기대한다. 무엇보다 신앙생활을 지키면서 일할 수 있는 직장이라고 생각한다.\r\n\r\n오랜 직장생활을 마치고 새로운 삶을 준비하면서, 다시 직장을 갖게 된다면 높은 급여나 지위보다 마음의 평안과 건강, 신앙생활을 소중히 여기며 일하고 싶다고 생각해 왔다.\r\n\r\n이번 채용은 내가 바라는 삶의 방향과 잘 맞는 기회이기에 꼭 입사하고 싶은","status":"published","created_at":"2026-11-01T21:52:40.787Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":50,"title":"2026년11월3일(화)QT","content":"# 11월 3일 아침 말씀 묵상\r\n**본문: 사무엘상 27~31장**\r\n\r\n오늘 말씀에서는 사울에게 오랫동안 쫓기던 다윗이 블레셋 땅으로 피신하고, 아말렉의 공격으로 가족과 재산을 잃을 위기에 처했다가 하나님의 도우심으로 회복하는 모습을 보게 된다. 한편 사울은 블레셋과의 전쟁에서 패하고 세 아들과 함께 비극적인 최후를 맞이한다.\r\n\r\n특히 사울과 다윗이 어려움 앞에서 보여 준 서로 다른 모습이 마음에 남는다.\r\n\r\n사울은 블레셋 군대를 보고 크게 두려워하여 하나님께 물었지만 응답을 받지 못하자, 하나님께서 금하신 신접한 여인을 찾아가 앞날을 물었다. 반면 다윗은 아말렉이 시글락을 공격하여 가족들을 사로잡아 간 절망적인 상황에서 하나님을 의지하였다.\r\n\r\n사무엘상 30장 6절 말씀이다.\r\n\r\n**“다윗이 그의 하나님 여호와를 힘입고 용기를 얻었더라.”**\r\n\r\n다윗은 자신을 따르던 사람들마저 분노하여 돌로 치려고 하는 상황에 처했다. 가족을 잃을지도 모르는 두려움과 부하들의 원망까지 감당해야 하는 절박한 순간이었다.\r\n\r\n그러나 다윗은 그 상황에서 하나님을 의지하며 다시 일어설 힘을 얻었다. 그리고 하나님께 아말렉을 추격해야 할지 여쭈었고, 하나님의 응답에 따라 행동하여 가족과 빼앗긴 재산을 되찾았다.\r\n\r\n이 말씀을 보면서 다윗의 믿음을 조금이라도 닮고 싶다는 생각이 든다.\r\n\r\n다윗도 두려움과 걱정이 있었겠지만, 어려움 가운데 하나님께 나아가 도움을 구하였다. 자신의 능력이나 판단만 의지하지 않고 하나님의 뜻을 먼저 구했던 것이다.\r\n\r\n반면 사울은 하나님의 말씀을 거듭 거역하였고, 결국 하나님의 응답을 받지 못하자 신접한 여인까지 찾아갔다. 사울 역시 두려움","status":"published","created_at":"2026-11-02T21:01:31.608Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":51,"title":"2026년11월4일(수)QT","content":"# 11월 4일 아침 말씀 묵상\r\n**본문: 사무엘하 2~4장**\r\n\r\n오늘 말씀에서는 사울이 죽은 후 다윗이 유다의 왕이 되고, 사울의 아들 이스보셋이 이스라엘의 왕으로 세워지면서 두 집안 사이에 갈등이 이어지는 모습을 보게 된다.\r\n\r\n특히 사무엘하 2장 1절 말씀이 마음에 남는다.\r\n\r\n**“그 후에 다윗이 여호와께 여쭈어 이르되 내가 유다 한 성읍으로 올라가리이까 여호와께서 이르시되 올라가라.”**\r\n\r\n사울이 죽은 후 다윗에게는 새로운 기회가 찾아왔다. 오랫동안 자신을 죽이려고 쫓아다니던 사울이 죽었고, 이제 왕으로 나아갈 수 있는 상황이 되었다.\r\n\r\n그러나 다윗은 자신의 생각대로 행동하지 않았다. 먼저 하나님께 어디로 가야 할지 여쭈었고, 하나님께서 헤브론으로 가라고 말씀하시자 그대로 순종하였다.\r\n\r\n이러한 다윗의 모습을 보면서 그가 얼마나 하나님을 신뢰하고 경외하였는지 생각하게 된다.\r\n\r\n다윗은 사울에게 쫓기던 어려운 순간에도 하나님께 물었고, 사울이 죽은 후 새로운 길이 열리는 순간에도 하나님께 물었다. **어려울 때뿐 아니라 형편이 좋아졌을 때에도 하나님을 먼저 찾는 믿음**을 가지고 있었던 것이다.\r\n\r\n또한 다윗은 하나님께 기름 부음을 받았다고 해서 자신의 힘으로 왕권을 차지하려 하지 않았다. 사무엘하 3~4장에서도 사울의 집안과 갈등이 계속되었지만, 다윗은 아브넬의 죽음을 슬퍼하였고 이스보셋을 살해한 사람들을 벌하였다.\r\n\r\n하나님의 약속이 이루어지기를 기다리면서도 자신의 목적을 이루기 위해 잘못된 방법을 사용하지 않으려는 다윗의 모습을 보게 된다.\r\n\r\n오늘 말씀을 묵상하면서 나의 삶도 돌아보게 된다.\r\n\r\n나는 중요한 일이 있을 때 하나님","status":"published","created_at":"2026-11-03T21:52:58.506Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":52,"title":"2026년11월9일(월) QT","content":"# 11월 9일 아침 말씀 묵상\n\n**본문: 시편 3편**\n\n오늘 말씀은 다윗이 아들 압살롬을 피해 도망할 때 하나님께 드린 기도이다.\n\n다윗은 아들에게 왕위를 위협받고, 자신을 대적하는 사람들이 많아진 절망적인 상황에서도 하나님을 의지하며 기도하였다.\n\n특히 3절 말씀이 마음에 깊이 다가온다.\n\n**“여호와여 주는 나의 방패시요 나의 영광이시요 나의 머리를 드시는 자이시니이다.”**\n\n다윗은 왕으로서의 지위와 명예를 잃을 위기에 있었지만, 자신의 진정한 영광은 왕의 자리가 아니라 하나님께 있음을 고백하였다.\n\n또한 하나님께서 자신의 방패가 되어 주시고, 낙심한 가운데서도 다시 머리를 들게 하시는 분임을 믿었다.\n\n이 말씀을 묵상하면서 지금까지 나의 삶을 돌아보게 된다.\n\n나 역시 살아오면서 많은 어려움과 걱정을 경험했지만, 그때마다 하나님께 기도하며 도움을 구했고 하나님께서 여기까지 나를 지켜 주셨음을 고백한다.\n\n오랫동안 직장생활을 하면서 성과와 지위, 다른 사람들의 평가를 중요하게 생각하며 살아왔다. 그러나 이제는 세상에서 어떤 자리에 있느냐보다 하나님께서 나와 함께하시고 나를 붙들어 주신다는 사실이 더욱 중요하다는 생각이 든다.\n\n**하나님이 나의 영광이시며 나의 머리를 들게 하시는 분이라는 사실을 기억하고 싶다.**\n\n4절에서 다윗은 이렇게 고백한다.\n\n**“내가 나의 목소리로 여호와께 부르짖으니 그의 성산에서 응답하시는도다.”**\n\n하나님께서는 나의 기도를 들으시고 응답하시는 분이시다.\n\n나는 하나님을 나의 아버지로 믿는다. 그렇기에 어려운 일이 있을 때뿐 아니라 일상의 크고 작은 일들도 아버지께 말씀드리며 도움과 인도하심을 구하고 싶다.\n\n","status":"published","created_at":"2026-11-09T00:50:06.191Z","category":"말씀묵상","attachment_key":null,"attachment_name":null,"attachment_type":null,"complete":false},{"id":53,"title":"2026년11월11일 QT","content":"11월 11일 아침 말씀 묵상\r\n본문: 사무엘하 21~22장\r\n\r\n오늘 말씀에서는 다윗이 자신을 오랫동안 죽이려 했던 사울의 뼈를 수습하여 정중하게 장사 지내는 모습이 마음에 남는다.\r\n\r\n다윗은 사울에게 많은 고통을 받았지만, 사울이 죽은 뒤에도 그를 함부로 대하지 않았다. 이 모습을 보면서 다윗의 바른 성품과 하나님께 기름 부음 받은 사람을 끝까지 존중했던 하나님을 경외하는 마음을 생각하게 된다.\r\n\r\n말씀을 묵상하면서 나 자신의 내면을 돌아본다.\r\n\r\n다른 사람들은 나를 온화하고 착한 성품을 가진 사람으로 바라보는 것 같다. 그러나 내가 내 마음을 들여다보면 여전히 이기적인 모습과 시기심, 욕심이 있음을 발견한다. 겉으로 드러나는 모습과 달리 내 안에는 아직도 내려놓지 못한 마음들이 많다.\r\n\r\n특히 퇴직한 이후의 내 모습을 돌아보게 된다.\r\n\r\n26년 동안 직장생활을 열심히 해왔고, 이제 50세가 넘어 새로운 삶을 시작하고 있다. 오랫동안 직장생활을 하면서 겪었던 스트레스와 부담에서 벗어나 마음의 평안을 찾고, 하나님을 더욱 가까이하는 삶을 살고 싶어 스스로 퇴직을 선택했다.\r\n\r\n그런데 막상 직장이 없는 상태가 되니 나도 모르게 위축되는 마음이 생긴다. 하루라도 빨리 새로운 직장을 구해야 할 것 같고, 다른 사람들이 지금의 나를 어떻게 바라볼지도 신경 쓰인다.\r\n\r\n문득 나 자신에게 질문하게 된다.\r\n\r\n나는 왜 이렇게 재취업을 서두르고 있는가? 정말 내가 원하는 일을 하기 위해서인가, 아니면 다른 사람들에게 “저 다시 취업해서 어디 다니고 있어요”라고 말하고 싶은 마음 때문인가?\r\n\r\n사회생활을 하면서 다른 사람들의 시선을 어느 정도 의식하는 것은 자연스러운 일","status":"published","created_at":"2026-11-10T21:47:10.309Z",
