    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h3m3 0h2"/>',
    pen: '<path d="m4 20 4.6-1 10.9-11a2.8 2.8 0 0 0-4-4L4.6 15 4 20zm9.5-13.5 4 4"/>',
    search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',
    plane: '<path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/>',
    camera: '<path d="M4 6h4l2-3h4l2 3h4c1 0 2 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8c0-1 1-2 2-2z"/><circle cx="12" cy="13" r="3.5"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6 6-2z"/>',
    book: '<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1zm0 0v15M6 8h3m6 0h3"/>',
    bubble: '<path d="M21 11a8 8 0 0 1-8 8H9l-5 3 1-5a8 8 0 0 1 5-14h3a8 8 0 0 1 8 8zM8 11h8"/>',
    chevron: '<path d="m9 6 6 6-6 6"/>',
    paperclip: '<path d="m8 14 6-6a2.6 2.6 0 1 1 4 4l-7.5 7.5a4.5 4.5 0 0 1-6.4-6.4l8-8"/>',
  };

  function icon(name) {
    return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + paths[name] + '</svg>';
  }

  function element(tag, cssClass, text) {
    const node = document.createElement(tag);
    if (cssClass) node.className = cssClass;
    if (text != null) node.textContent = text;
    return node;
  }

  function button(label, cssClass, command, id) {
    const node = element("button", cssClass, label);
    node.type = "button";
    if (command) node.dataset.command = command;
    if (id != null) node.dataset.id = id;
    return node;
  }

  function link(label, cssClass, href) {
    const node = element("a", cssClass, label);
    node.href = href;
    if (/^https:\/\//.test(href)) {
      node.target = "_blank";
      node.rel = "noopener";
    }
    return node;
  }

  function dateKey() {
    const date = new Date();
    const padded = (value) => String(value).padStart(2, "0");
    return date.getFullYear() + "-" + padded(date.getMonth() + 1) + "-" + padded(date.getDate());
  }

  function normalized(value) {
    return String(value ?? "").normalize("NFC").toLocaleLowerCase("ko-KR").trim();
  }

  function readData(raw) {
    if (!Array.isArray(raw?.posts) || !Array.isArray(raw?.schedules)) throw new Error("기존 사이트의 데이터 파일을 선택해 주세요.");
    const posts = raw.posts.map((post) => ({
      id: Number(post.id), title: post.title, content: post.content, status: post.status,
      category: post.category || "여행플랜", complete: post.complete !== false,
      createdAt: post.createdAt ?? post.created_at ?? "",
      attachmentKey: post.attachmentKey ?? post.attachment_key ?? "",
      attachmentName: post.attachmentName ?? post.attachment_name ?? "",
    }));
    const schedules = raw.schedules.map((item) => ({
      id: Number(item.id), title: item.title, date: item.date, endDate: item.endDate ?? item.end_date ?? "",
      time: item.time ?? "", color: item.color ?? "",
    }));
    if (posts.some((post) => !Number.isInteger(post.id) || typeof post.title !== "string" || typeof post.content !== "string") ||
        schedules.some((item) => !Number.isInteger(item.id) || typeof item.title !== "string" || typeof item.date !== "string")) {
      throw new Error("글 또는 일정 데이터에 필요한 항목이 없어요.");
    }
    posts.sort((a, b) => b.id - a.id);
    schedules.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
    return { posts, schedules };
  }

  const initialDocument = "<!doctype html>\n" + document.documentElement.outerHTML;
  let data = readData(JSON.parse($("snapshot").textContent));
  let category = "";
  let query = "";
  let visibleLimit = 8;
  let allSchedules = false;
  let dialogTrigger = null;
  let pending = false;
  let synchronized = false;
  const dialog = $("dialog");

  function categoryInfo(name) {
    return categories.find((item) => item[0] === name) ?? [name, "list", "#e0f3fc", "#135f87"];
  }

  function categoryMark(name) {
    const [, mark, bg, fg] = categoryInfo(name);
    const symbol = element("span", "category-symbol");
    symbol.setAttribute("aria-hidden", "true");
    symbol.style.setProperty("--tone-bg", bg);
    symbol.style.setProperty("--tone-fg", fg);
    symbol.innerHTML = icon(mark);
    return symbol;
  }

  function renderCategories() {
    const names = [...new Set([...categories.map(([name]) => name), ...data.posts.map((post) => post.category)])];
    const tiles = names.map((name) => {
      const item = button(null, "category", "category-grid");
      item.dataset.category = name;
      item.setAttribute("aria-pressed", String(category === name));
      item.append(categoryMark(name), element("span", "category-label", name),
        element("span", "category-count", data.posts.filter((post) => post.category === name).length + "개"));
      return item;
    });
    const filters = ["", ...names].map((name) => {
      const chip = button(name || "전체", "chip", "category-filter");
      chip.dataset.category = name;
      chip.setAttribute("aria-pressed", String(category === name));
      return chip;
    });
    $("categories").replaceChildren(...tiles);
    $("filters").replaceChildren(...filters);
  }

  function renderPosts() {
    const tokens = normalized(query).split(/\s+/).filter(Boolean);
    const posts = data.posts.filter((post) => (!category || post.category === category) &&
      tokens.every((token) => normalized(post.title + " " + post.category + " " + post.content).includes(token)));
    const items = posts.slice(0, visibleLimit).map((post) => {
      const card = element("article", "post");
      const opener = button(null, "post-trigger", "read", post.id);
      const summary = element("div", "post-open");
      opener.setAttribute("aria-label", post.title + " 읽기");
      const box = element("div", "post-detail");
      const meta = element("div", "post-meta");
      const day = String(post.createdAt).slice(0, 10);
      const time = element("time", null, day);
      if (day) time.dateTime = day;
      meta.append(time, element("span", null, post.status === "published" ? "게시됨" : "초안"));
      if (post.attachmentKey) meta.append(element("span", null, "첨부파일"));
      const excerpt = post.content.replace(/\s+/g, " ").trim();
      box.append(element("span", "post-tag", post.category), element("h3", null, post.title),
        element("p", "excerpt", excerpt.length > 150 ? excerpt.slice(0, 150) + "…" : excerpt), meta);
      summary.append(categoryMark(post.category), box);
      const chevron = element("span");
      chevron.setAttribute("aria-hidden", "true");
      chevron.innerHTML = icon("chevron");
      card.append(summary, chevron, opener);
      return card;
    });
    if (!items.length) items.push(element("p", "empty", query ? "검색 결과가 없어요." : "이 카테고리에 아직 글이 없어요."));
    if (posts.length > visibleLimit) {
      const more = button("글 더 보기", "plain", "more");
      more.style.gridColumn = "1 / -1";
      more.style.justifySelf = "center";
      items.push(more);
    }
    $("writing-heading").textContent = category || "글 목록";
    $("post-count").textContent = posts.length + "개";
    $("posts").replaceChildren(...items);
  }

  function renderSchedules() {
    const rows = allSchedules ? data.schedules : data.schedules.filter((item) => (item.endDate || item.date) >= dateKey());
    const cards = rows.map((item) => {
      const node = element("article", "schedule-row");
      const date = element("time", "schedule-date", item.date.slice(5).replace("-", "."));
      date.dateTime = item.date;
      if (/^#[0-9a-fA-F]{6}$/.test(item.color)) date.style.borderBottom = "3px solid " + item.color;
      const details = element("div", "schedule-detail");
      const range = item.endDate && item.endDate !== item.date ? item.date + " ~ " + item.endDate : item.date;
      details.append(element("strong", null, item.title), element("p", null, [range, item.time].filter(Boolean).join(" · ")));
      node.append(date, details);
      if (synchronized) node.append(button("수정", "plain schedule-edit", "edit-schedule", item.id));
      return node;
    });
    if (!rows.length) cards.push(element("p", "empty", allSchedules ? "저장된 일정이 없어요." : "다가오는 일정이 없어요. 이전 일정은 ‘전체 일정’에서 볼 수 있어요."));
    $("schedules").replaceChildren(...cards);
    document.querySelectorAll("[data-schedule-mode]").forEach((item) => {
      item.setAttribute("aria-pressed", String((item.dataset.scheduleMode === "all") === allSchedules));
    });
  }

  function render() {
    renderCategories();
    renderPosts();
    renderSchedules();
  }

  function announce(message) {
    $("notice").textContent = message;
    $("notice").hidden = !message;
  }

  function gotoSection(hash) {
    if (location.hash !== hash) history.pushState(null, "", hash);
    updateNavigation();
    const section = $(hash.slice(1));
    section.querySelector("h1, h2")?.focus({ preventScroll: true });
    section.scrollIntoView({block:"start"});
  }

  function updateNavigation() {
    const hash = ["#writing", "#schedule"].includes(location.hash) ? location.hash : "#home";
    document.querySelectorAll("nav a[href^='#']").forEach((item) => {
      if (item.hash === hash) item.setAttribute("aria-current", "page");
      else item.removeAttribute("aria-current");
    });
  }

  function showDialog(label, title, invokingElement) {
    if (!dialog.open) dialogTrigger = invokingElement;
    $("dialog-label").textContent = label;
    const heading = element("h2", null, title);
    heading.id = "dialog-heading";
    const content = $("dialog-body");
    content.replaceChildren(heading);
    if (!dialog.open) dialog.showModal();
    dialog.scrollTop = 0;
    return content;
  }

  function readPost(post, trigger) {
    const body = showDialog(post.category, post.title, trigger);
    body.append(element("p", "post-meta", String(post.createdAt).slice(0,10) + " · " +
      (post.status === "published" ? "게시됨" : "초안")));
    body.append(element("div", "reader-text", post.content));
    const actions = element("div", "dialog-actions");
    if (!post.complete) {
      body.append(element("p", "note", "이 파일에는 본문 일부가 들어 있습니다. 원본 홈페이지 또는 원본 데이터 파일에서 전문을 볼 수 있어요."));
      actions.append(link("원본 글 목록 열기", "action", site + "/#writing"));
      if (!connected) actions.append(button("원본 데이터 불러오기", "plain", "show-import"));
    }
    if (post.attachmentKey) {
      const path = "/api/attachments/" + encodeURIComponent(post.attachmentKey);
      const file = link(post.attachmentName || "첨부파일 열기", "plain", connected ? path : site + path);
      file.target = "_blank";
      file.rel = "noopener";
      actions.append(file);
    }
    if (synchronized && post.complete) actions.append(button("글 수정", "action", "edit-post", post.id));
    if (actions.childElementCount) body.append(actions);
  }

  function makeField(form, label, control, attributes) {
    const field = element("label", null, label);
    const input = element(control);
    for (const [key, value] of Object.entries(attributes)) input[key] = value;
    field.append(input);
    form.append(field);
    return input;
  }

  function editor(kind, record, trigger) {
    const post = kind === "post";
    const noun = post ? "글" : "일정";
    const body = showDialog(noun + " 관리", record ? noun + " 수정" : (post ? "새 글 쓰기" : "일정 추가"), trigger);
    const form = element("form", "editform");
    makeField(form, post ? "제목" : "일정 이름", "input", { name:"title", required:true, value:record?.title ?? "" });
    const actions = element("div", "dialog-actions");
    if (post) {
      const select = makeField(form, "카테고리", "select", { name:"category", required:true });
      const names = [...new Set([...categories.map(([name]) => name), record?.category].filter(Boolean))];
      for (const name of names) select.add(new Option(name, name));
      select.value = record?.category || category || categories[0][0];
      makeField(form, "내용", "textarea", { name:"content", rows:8, required:true, value:record?.content ?? "" });
      makeField(form, record?.attachmentName ? "첨부파일 변경 · 현재 " + record.attachmentName : "첨부파일 (최대 10MB)", "input", { name:"attachment", type:"file" });
      for (const [status, label] of [["draft","초안 저장"], ["published","게시하기"]]) {
        const submit = button(label, status === "draft" ? "plain" : "action");
        submit.type = "submit";
        submit.value = status;
        actions.append(submit);
      }
    } else {
      const row = element("div", "form-row");
      const start = makeField(row, "시작일", "input", { name:"date", type:"date", value:record?.date || dateKey(), required:true });
      const end = makeField(row, "종료일", "input", { name:"endDate", type:"date", value:record?.endDate || start.value, required:true, min:start.value });
      start.addEventListener("input", () => {
        end.min = start.value;
        if (!end.value || end.value < start.value) end.value = start.value;
      });
      form.append(row);
      makeField(form, "시간 (선택)", "input", { name:"time", type:"time", value:record?.time ?? "" });
      const colors = makeField(form, "표시 색상", "select", { name:"color" });
      for (const [name,value] of [["코랄","#e87a5d"],["그린","#6c8a78"],["골드","#d6aa45"],["라벤더","#7f7aa8"]]) colors.add(new Option(name,value));
      if (record?.color && ![...colors.options].some((item) => item.value === record.color)) colors.add(new Option("현재 색상",record.color));
      colors.value = record?.color || "#e87a5d";
      const save = button("일정 저장", "action");
      save.type = "submit";
      actions.append(save);
    }

    const message = element("p", "form-message");
    message.setAttribute("role", "alert");
    if (record) actions.append(button(noun + " 삭제", "plain", "delete-" + kind, record.id));
    form.append(actions, message);
    body.append(form);

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const values = new FormData(form);
      if (post) values.set("status", event.submitter?.value || record?.status || "draft");
      const options = { method:record ? "PUT" : "POST", body:values };
      if (!post) {
        options.headers = { "Content-Type":"application/json" };
        options.body = JSON.stringify(Object.fromEntries(values));
      }
      mutate(kind, record?.id, options, noun + "을 저장했어요.");
    });
  }

  async function mutate(kind, id, options, success) {
    if (pending) return;
    pending = true;
    const controls = [...dialog.querySelectorAll("button")];
    for (const control of controls) control.disabled = true;
    const message = dialog.querySelector(".form-message");
    if (message) message.textContent = "";
    try {
      const base = kind === "post" ? "/api/posts" : "/api/schedules";
      const response = await fetch(base + (id == null ? "" : "/" + id), options);
      if (!response.ok) {
        const error = await response.json().catch(() => null);
        throw new Error(error?.error || "변경 사항을 저장하지 못했어요.");
      }
      dialog.close();
      announce(success);
      await refresh(true);
    } catch (error) {
      if (message) message.textContent = error.message;
      else announce(error.message);
    } finally {
      pending = false;
      for (const control of controls) control.disabled = false;
    }
  }

  async function refresh(afterMutation = false) {
    try {
      const result = await fetch("/api/data", { cache:"no-store", credentials:"same-origin" });
      if (!result.ok) throw new Error();
      data = readData(await result.json());
      synchronized = true;
      render();
    } catch {
      announce(afterMutation ? "저장했지만 새 목록을 불러오지 못했어요. 페이지를 다시 열어 확인해 주세요." :
        "사이트 데이터를 불러오지 못했어요. 저장된 목록을 표시합니다.");
    }
  }

  function showSiteAction(kind, trigger) {
    const post = kind === "post";
    if (synchronized) editor(kind, null, trigger);
    else if (connected) announce("저장하려면 원본 데이터를 불러와야 해요. 페이지를 새로 고쳐 주세요.");
    else {
      const body = showDialog(post ? "글 관리" : "일정 관리", post ? "기존 사이트에서 글쓰기" : "기존 사이트에서 일정 추가", trigger);
      body.append(element("p", "note", "기존 사이트에서 로그인하면 글과 일정을 저장하거나 수정할 수 있어요."));
      const actions = element("div", "dialog-actions");
      actions.append(link("기존 홈페이지 열기", "action", site + (post ? "/#writing" : "/#schedule")));
      body.append(actions);
    }
  }

  function saveCompleteCopy() {
    const safeData = JSON.stringify(data).replace(/</g, "\\u003c");
    const html = initialDocument.replace(/(<script id="snapshot" type="application\/json">)[\s\S]*?(<\/script>)/, (_, start, end) => start + safeData + end);
    const url = URL.createObjectURL(new Blob([html], { type:"text/html;charset=utf-8" }));
    const download = link("", null, url);
    download.download = "haru-sentence-complete.html";
    document.body.append(download);
    download.click();
    download.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  document.querySelectorAll("[data-icon]").forEach((item) => { item.innerHTML = icon(item.dataset.icon); });
  $("source-data").href = site + "/api/data";
  $("file-mode").hidden = connected;
  if (!connected && data.posts.some((post) => !post.complete)) {
    const notice = element("p", "note", "파일에서 일부 글은 미리보기로 표시됩니다.");
    notice.append(" ", button("전문 불러오기", "plain", "show-import"));
    $("posts").before(notice);
    notice.id = "preview-note";
  }

  $("search-form").addEventListener("submit", (event) => {
    event.preventDefault();
    query = $("query").value;
    visibleLimit = 8;
    renderPosts();
    gotoSection("#writing");
  });
  $("query").addEventListener("input", () => {
    if (!query || $("query").value) return;
    query = "";
    visibleLimit = 8;
    renderPosts();
  });

  $("import-data").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const feedback = $("file-status");
    feedback.hidden = false;
    try {
      const imported = readData(JSON.parse(await file.text()));
      data = imported;
      if (!data.posts.some((post) => post.category === category)) category = "";
      render();
      if (data.posts.every((post) => post.complete)) $("preview-note")?.remove();
      feedback.textContent = "글 " + data.posts.length + "건과 일정 " + data.schedules.length + "건을 불러왔어요. ";
      feedback.append(button("전문 포함 HTML 저장", "plain", "save-copy"));
    } catch {
      feedback.textContent = "데이터를 읽지 못했어요. 기존 사이트에서 저장한 JSON 파일을 선택해 주세요.";
    } finally {
      event.target.value = "";
    }
  });

  document.addEventListener("click", (event) => {
    const target = event.target.closest("button");
    if (!target) return;
    if (target.dataset.scheduleMode) {
      allSchedules = target.dataset.scheduleMode === "all";
      renderSchedules();
      return;
    }
    const id = Number(target.dataset.id);
    switch (target.dataset.command) {
      case "category-grid":
      case "category-filter": {
        category = target.dataset.category;
        visibleLimit = 8;
        const grid = target.dataset.command === "category-grid";
        if (grid) query = $("query").value = "";
        renderCategories();
        renderPosts();
        if (grid) gotoSection("#writing");
        else [...$("filters").children].find((item) => item.dataset.category === category)?.focus();
        break;
      }
      case "more": {
        const firstNew = visibleLimit;
        visibleLimit += 8;
        renderPosts();
        $("posts").querySelectorAll(".post-trigger")[firstNew]?.focus();
        break;
      }
      case "read": readPost(data.posts.find((post) => post.id === id), target); break;
      case "new-post": showSiteAction("post", target); break;
      case "new-schedule": showSiteAction("schedule", target); break;
      case "edit-post": if (synchronized) editor("post", data.posts.find((post) => post.id === id), target); break;
      case "edit-schedule": if (synchronized) editor("schedule", data.schedules.find((item) => item.id === id), target); break;
      case "delete-post":
      case "delete-schedule": {
        if (!synchronized) break;
        const isPost = target.dataset.command === "delete-post";
        if (confirm(isPost ? "이 글과 첨부파일을 삭제할까요?" : "이 일정을 삭제할까요?")) {
          mutate(isPost ? "post" : "schedule", id, { method:"DELETE" }, isPost ? "글을 삭제했어요." : "일정을 삭제했어요.");
        }
        break;
      }
      case "show-import":
        if (dialog.open) dialog.close();
        $("file-mode").querySelector("details").open = true;
        $("file-mode").scrollIntoView({block:"start"});
        $("source-data").focus({preventScroll:true});
        break;
      case "save-copy": saveCompleteCopy(); break;
      case "close": dialog.close(); break;
    }
  });

  dialog.addEventListener("cancel", (event) => { if (pending) event.preventDefault(); });
  dialog.addEventListener("close", () => {
    if (document.activeElement !== $("source-data")) dialogTrigger?.focus();
    dialogTrigger = null;
  });
  window.addEventListener("hashchange", updateNavigation);
  render();
  updateNavigation();
  if (connected) refresh();
})();

</script>
</body>
</html>
